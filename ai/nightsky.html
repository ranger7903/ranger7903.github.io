/* ── 그리기 ── */
var cv=document.getElementById("sky"), cx=540, cy=560, RAD=470, last=null;
function proj(alt,az){ var r=RAD*Math.tan((90-alt)*D2R/2); return [cx-r*Math.sin(az*D2R), cy-r*Math.cos(az*D2R)]; }
function draw(){
  if(!last) return; var L=VT.lang, g=cv.getContext("2d"), s=last.sky, lat=last.lat, lst=s.lst;
  g.fillStyle="#0E1424"; g.fillRect(0,0,1080,1350);
  var day=s.sunAlt>-0.8, twi=!day&&s.sunAlt>-12;
  var grd=g.createRadialGradient(cx,cy,0,cx,cy,RAD); grd.addColorStop(0,day?"#3B5C8C":twi?"#1F2D52":"#121B33"); grd.addColorStop(1,day?"#6C8DBA":twi?"#33416A":"#1A2442");
  g.save(); g.beginPath(); g.arc(cx,cy,RAD,0,2*Math.PI); g.fillStyle=grd; g.fill(); g.clip();
  g.strokeStyle="rgba(200,215,255,.32)"; g.lineWidth=1.6;
  Object.keys(SKY.l).forEach(function(k){ SKY.l[k].forEach(function(seg){
    var pts=seg.map(function(p){ var q=prec(p[0],p[1],s.d/36525); return altaz(q[0],q[1],lst,lat); });
    g.beginPath(); var pen=false;
    pts.forEach(function(a){ if(a[0]<-2){pen=false;return;} var xy=proj(a[0],a[1]); if(pen) g.lineTo(xy[0],xy[1]); else g.moveTo(xy[0],xy[1]); pen=true; });
    g.stroke(); }); });
  SKY.s.forEach(function(st){ var q=prec(st[0],st[1],s.d/36525), a=altaz(q[0],q[1],lst,lat); if(a[0]<0) return; var xy=proj(a[0],a[1]);
    var rr=Math.max(0.9,4.6-0.85*st[2]); g.beginPath(); g.arc(xy[0],xy[1],rr,0,2*Math.PI); g.fillStyle="rgba(255,250,235,"+Math.min(1,1.15-0.13*st[2])+")"; g.fill(); });
  /* 이름표: 달 → 행성 → 큰 별자리 차례로, 겹치면 건너뛴다 */
  var boxes=[]; g.textAlign="center";
  function label(txt,x,y,font,color,tries){ g.font=font; var w=g.measureText(txt).width+8, h=parseInt(font.replace(/^\D*/,""),10)+6;
    for(var i=0;i<tries.length;i++){ var yy=y+tries[i], dy=Math.max(Math.abs(yy-h+4-cy),Math.abs(yy+4-cy));
      if(dy>RAD-12) continue;
      var half=Math.sqrt(RAD*RAD-dy*dy)-8, xx=Math.min(Math.max(x,cx-half+w/2),cx+half-w/2); if(half<w/2) continue;
      var r=[xx-w/2,yy-h+4,xx+w/2,yy+4];
      if(!boxes.some(function(o){return r[0]<o[2]&&r[2]>o[0]&&r[1]<o[3]&&r[3]>o[1];})){ boxes.push(r); g.fillStyle=color; g.fillText(txt,xx,yy); return true; } }
    return false; }
  var dots=[];
  s.planets.forEach(function(p){ if(p.aa[0]<0) return; var xy=proj(p.aa[0],p.aa[1]); dots.push([xy,p]);
    g.beginPath(); g.arc(xy[0],xy[1],7,0,2*Math.PI); g.fillStyle="#FFD27A"; g.fill(); boxes.push([xy[0]-9,xy[1]-9,xy[0]+9,xy[1]+9]); });
  if(s.moon[0]>0){ var m=proj(s.moon[0],s.moon[1]), sp=proj(Math.max(s.sun[0],-85),s.sun[1]);
    moonIcon(g,m[0],m[1],22,s.lit,Math.atan2(sp[1]-m[1],sp[0]-m[0])); boxes.push([m[0]-24,m[1]-24,m[0]+24,m[1]+24]);
    label(L==="ko"?"달":"Moon",m[0],m[1],"bold 24px system-ui,'Malgun Gothic',sans-serif","#FFF4D6",[-30,50,-56,76]); }
  dots.forEach(function(q){ label(PL[q[1].n][L==="ko"?0:1],q[0][0],q[0][1],"bold 24px system-ui,'Malgun Gothic',sans-serif","#FFE2A6",[-14,34,-40,58]); });
  Object.keys(SKY.n).filter(function(k){return SKY.l[k];}).sort(function(a,b){return SKY.n[a].r-SKY.n[b].r;}).forEach(function(k){
    var nn=SKY.n[k], q=prec(nn.p[0],nn.p[1],s.d/36525), a=altaz(q[0],q[1],lst,lat); if(a[0]<10||nn.r>2) return;
    var xy=proj(a[0],a[1]); label(L==="ko"?nn.ko:nn.en,xy[0],xy[1],"22px system-ui,'Malgun Gothic',sans-serif","rgba(210,222,255,.78)",[0,-24,24]); });
  g.restore();
  g.beginPath(); g.arc(cx,cy,RAD,0,2*Math.PI); g.strokeStyle="#C9B48A"; g.lineWidth=3; g.stroke();
  g.font="bold 30px system-ui,'Malgun Gothic',sans-serif"; g.fillStyle="#C9B48A";
  [["N",0,-RAD-24],["S",0,RAD+44],["E",-RAD-30,10],["W",RAD+30,10]].forEach(function(q){ g.fillText(VT.t(q[0]),cx+q[1],cy+q[2]); });
  var cap=document.getElementById("cap").value.trim();
  g.textAlign="center"; g.fillStyle="#F3E9D6";
  g.font="bold 46px 'Noto Serif KR',Georgia,'Batang',serif"; if(cap) g.fillText(cap,cx,1150);
  g.font="30px system-ui,'Malgun Gothic',sans-serif"; g.fillStyle="#D9CDB6"; g.fillText(last.when,cx,cap?1210:1170);
  g.fillText(last.where,cx,cap?1256:1216);
  g.font="22px system-ui,sans-serif"; g.fillStyle="rgba(217,205,182,.6)"; g.fillText("valuestools.kr/ai/nightsky.html",cx,1318);
}
function moonIcon(g,x,y,r,lit,ang){ /* 밝은 쪽이 해가 있는 쪽을 보게 돌려 그린다 */
  g.save(); g.translate(x,y); g.rotate(ang);
  g.beginPath(); g.arc(0,0,r,0,2*Math.PI); g.fillStyle="#3A3F52"; g.fill();
  g.beginPath(); g.arc(0,0,r,-Math.PI/2,Math.PI/2,false); g.closePath(); g.fillStyle="#FFF4D6"; g.fill();
  g.beginPath(); g.ellipse(0,0,Math.abs(1-2*lit)*r+0.01,r,0,0,2*Math.PI); g.fillStyle=lit>0.5?"#FFF4D6":"#3A3F52"; g.fill();
  g.restore(); }
function fmtWhen(y,mo,da,h,mi){ var L=VT.lang, hh=("0"+h).slice(-2)+":"+("0"+mi).slice(-2);
  if(L==="ko") return y+"년 "+mo+"월 "+da+"일 "+(h<12?"오전 ":"오후 ")+((h%12)||12)+":"+("0"+mi).slice(-2);
  return ["January","February","March","April","May","June","July","August","September","October","November","December"][mo-1]+" "+da+", "+y+" · "+hh; }
function facts(){
  var s=last.sky, L=VT.lang, h="";
  if(s.sunAlt>-0.8) h+="<li><b>"+VT.t("f_day")+"</b><br>"+VT.t("f_day_s")+"</li>";
  else if(s.sunAlt>-12) h+="<li><b>"+VT.t("f_twi")+"</b><br>"+VT.t("f_twi_s")+"</li>";
  h+="<li><b>"+VT.t("f_moon")+"</b><br>"+VT.t("m"+s.phase)+" · "+VT.t("lit")+" "+Math.round(s.lit*100)+"% · "+(s.moon[0]>0?VT.t("up"):VT.t("down"))+"</li>";
  var up=s.planets.filter(function(p){return p.aa[0]>0;}).map(function(p){return PL[p.n][L==="ko"?0:1];});
  h+="<li><b>"+VT.t("f_planets")+"</b><br>"+(up.length?up.join(", "):VT.t("none"))+"</li>";
  var best=null; Object.keys(SKY.n).forEach(function(k){ if(!SKY.l[k]) return; var nn=SKY.n[k], a=altaz(nn.p[0],nn.p[1],s.lst,last.lat); if(!best||a[0]>best.a) best={a:a[0],nn:nn}; });
  if(best) h+="<li><b>"+VT.t("f_high")+"</b><br>"+VT.esc(L==="ko"?best.nn.ko:best.nn.en)+"</li>";
  document.getElementById("facts").innerHTML=h; }
function err(m){ var o=document.getElementById("out"); o.classList.remove("hidden"); document.getElementById("facts").innerHTML='<li class="verdict mid">'+VT.esc(m)+"</li>"; cv.style.display="none"; }
function run(){
  var dv=document.getElementById("d").value, tv=document.getElementById("t").value||"21:00";
  if(!dv) return err(VT.t("nodate"));
  var p=dv.split("-").map(Number), q=tv.split(":").map(Number);
  if(p[0]<1900||p[0]>2100) return err(VT.t("range"));
  var sel=document.getElementById("city").value, c, lat, lon, tz, where;
  if(sel==="here"&&here){ lat=here.lat; lon=here.lon; tz=Intl.DateTimeFormat().resolvedOptions().timeZone||"UTC"; where=VT.t("mylocation")+" ("+lat.toFixed(1)+"°, "+lon.toFixed(1)+"°)"; }
  else { c=CITIES.filter(function(x){return x[0]===sel;})[0]||CITIES[0]; lat=c[3]; lon=c[4]; tz=c[5]; where=VT.lang==="ko"?c[1]:c[2]; }
  var ms=wallToUtc(p[0],p[1],p[2],q[0],q[1],tz);
  last={sky:compute(ms,lat,lon),lat:lat,when:fmtWhen(p[0],p[1],p[2],q[0],q[1]),where:where};
  cv.style.display=""; draw(); facts();
  var o=document.getElementById("out"); o.classList.remove("hidden"); document.getElementById("saved").textContent="";
  o.scrollIntoView({behavior:"smooth",block:"start"});
}
function fillCities(){ var s=document.getElementById("city"), v=s.value||"seoul", L=VT.lang;
  s.innerHTML=(here?'<option value="here">📍 '+VT.t("mylocation")+"</option>":"")+CITIES.map(function(c){return '<option value="'+c[0]+'">'+VT.esc(L==="ko"?c[1]:c[2])+"</option>";}).join("");
  s.value=v; if(!s.value) s.value="seoul"; }
document.getElementById("go").onclick=run;
document.getElementById("here").onclick=function(){
  if(!navigator.geolocation) return err(VT.t("nogeo"));
  navigator.geolocation.getCurrentPosition(function(pos){ here={lat:pos.coords.latitude,lon:pos.coords.longitude}; fillCities(); document.getElementById("city").value="here"; },
    function(){ err(VT.t("nogeo")); },{timeout:10000,maximumAge:600000}); };
document.getElementById("sample").onclick=function(){
  document.getElementById("d").value="2026-12-24"; document.getElementById("t").value="22:00"; document.getElementById("city").value="seoul";
  document.getElementById("cap").value=VT.lang==="ko"?"우리의 첫 크리스마스":"Our first Christmas"; run(); };
function fname(){ return "night-sky-"+(document.getElementById("d").value||"")+".png"; }
document.getElementById("save").onclick=function(){ var a=document.createElement("a"); a.download=fname(); a.href=cv.toDataURL("image/png"); document.body.appendChild(a); a.click(); a.remove();
  document.getElementById("saved").textContent=VT.t("saved"); };
document.getElementById("share").onclick=function(){
  cv.toBlob(function(b){ var f=new File([b],fname(),{type:"image/png"});
    if(navigator.canShare&&navigator.canShare({files:[f]})) navigator.share({files:[f],title:VT.t("h1")}).catch(function(){});
    else document.getElementById("save").click(); },"image/png"); };
VT.onLang=function(){ fillCities(); if(last){ var c=CITIES.filter(function(x){return x[0]===document.getElementById("city").value;})[0]; if(c) last.where=VT.lang==="ko"?c[1]:c[2];
  var p=document.getElementById("d").value.split("-").map(Number), q=(document.getElementById("t").value||"21:00").split(":").map(Number); last.when=fmtWhen(p[0],p[1],p[2],q[0],q[1]); draw(); facts(); } };
VT.mountChrome(); VT.apply(); fillCities();
(function(){ var n=new Date(); document.getElementById("d").value=n.getFullYear()+"-"+("0"+(n.getMonth()+1)).slice(-2)+"-"+("0"+n.getDate()).slice(-2); })();
</script>
