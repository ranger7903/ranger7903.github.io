var URLS={ins:"https://cont.insure.or.kr",acct:"https://www.payinfo.or.kr",sleep:"https://www.kinfa.or.kr/financialLife/sleepmoney.do",points:"https://www.payinfo.or.kr",
  fine:"https://fine.fss.or.kr",onetax:"https://www.hometax.go.kr",silson:"https://www.silson24.or.kr",carv:"https://www.fss.or.kr",c1372:"https://www.ccn.go.kr",
  gov24:"https://www.gov.kr",bokji:"https://www.bokjiro.go.kr",inherit:"https://www.gov.kr"};
var A={}, shown=false;
function drawQ(){
  document.getElementById("qs").innerHTML=ClaimKR.Q.map(function(q,i){
    return '<div class="q"><b>'+(i+1)+'. '+VT.t("q_"+q)+'</b><div class="yn" role="group">'+[["y","yes"],["n","no"],["?","dk"]].map(function(o){
      return '<button type="button" data-q="'+q+'" data-v="'+o[0]+'" aria-pressed="'+(A[q]===o[0])+'">'+VT.t(o[1])+'</button>';}).join("")+'</div></div>';
  }).join("");
  document.querySelectorAll("#qs button").forEach(function(b){ b.onclick=function(){ A[b.dataset.q]=A[b.dataset.q]===b.dataset.v?undefined:b.dataset.v; drawQ(); if(shown) show(); }; });
}
function carOpen(){ return VT.ROOMS.some(function(r){return r.id==="carvalue"&&r.status==="open";}); }
function show(){
  var out=document.getElementById("out"), E=VT.esc;
  if(!shown){ out.classList.add("hidden"); return; }
  var r=ClaimKR.cards(A), h="";
  if(!r.answered){ out.innerHTML='<div class="verdict mid">'+VT.t("none")+'</div>'; out.classList.remove("hidden"); return; }
  h+='<div class="verdict low">'+(r.basic?VT.t("r_basic"):VT.t("r_t").replace("{n}",r.cards.length))+'<small>'+VT.t("r_s")+'</small></div>';
  h+=r.cards.map(function(c){
    var lv=c.level==="y"?'<span class="lv">'+VT.t("lv_y")+'</span>':c.level==="?"?'<span class="lv q">'+VT.t("lv_q")+'</span>':"";
    var extra="";
    if(c.id==="carv") extra=carOpen()?'<p style="margin:8px 0 0"><a href="carvalue.html"><b>'+VT.t("carlink")+'</b></a></p>':'<p class="note" style="margin:8px 0 0">'+VT.t("carsoon")+'</p>';
    return '<div class="cardx"><h3>'+VT.t("c_"+c.id+"_t")+lv+'</h3><dl>'+
      '<dt>'+VT.t("d_what")+'</dt><dd>'+VT.t("c_"+c.id+"_w")+'</dd>'+
      '<dt>'+VT.t("d_where")+'</dt><dd>'+VT.t("c_"+c.id+"_s")+'<br><a href="'+URLS[c.id]+'" target="_blank" rel="noopener">'+E(URLS[c.id].replace(/^https:\/\//,""))+'</a></dd>'+
      '<dt>'+VT.t("d_press")+'</dt><dd>'+VT.t("c_"+c.id+"_p")+'</dd>'+
      '<dt>'+VT.t("d_limit")+'</dt><dd>'+VT.t("c_"+c.id+"_l")+'</dd></dl>'+extra+'</div>';
  }).join("");
  h+='<p class="verdict mid" style="font-size:15px;font-weight:500">'+VT.t("scam")+'</p>';
  h+='<p class="legal">'+VT.t("legal")+'</p>';
  h+='<div class="row no-print"><button class="btn ghost" id="cp" type="button">'+VT.t("copy")+'</button><button class="btn ghost" id="pr" type="button">'+VT.t("print")+'</button><span class="note" id="cpok"></span></div>';
  out.innerHTML=h; out.classList.remove("hidden");
  document.getElementById("pr").onclick=function(){ window.print(); };
  document.getElementById("cp").onclick=function(){
    var strip=function(s){return s.replace(/<[^>]+>/g,"");};
    var t=r.cards.map(function(c,i){return (i+1)+". "+strip(VT.t("c_"+c.id+"_t"))+"\n   "+strip(VT.t("c_"+c.id+"_s"))+" "+URLS[c.id]+"\n   "+strip(VT.t("c_"+c.id+"_p"))+"\n   "+strip(VT.t("c_"+c.id+"_l"));}).join("\n\n");
    var ok=function(){document.getElementById("cpok").textContent=VT.t("copied");};
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok,function(){prompt("",t);}); else prompt("",t);
  };
}
document.getElementById("go").onclick=function(){ shown=true; show(); document.getElementById("out").scrollIntoView({behavior:"smooth",block:"start"}); };
document.getElementById("reset").onclick=function(){ A={}; shown=false; drawQ(); show(); window.scrollTo(0,0); };
VT.onLang=function(){ drawQ(); show(); }; VT.mountChrome(); VT.apply(); drawQ();
</script>
