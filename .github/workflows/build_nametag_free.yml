name: build-nametag-free
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pyinstaller
      - run: Expand-Archive nametag_src.zip -DestinationPath nametag
      - run: pyinstaller --noconfirm --onefile --windowed --name "nametag_free" nametag/run.py
      - run: Copy-Item dist/nametag_free.exe nametag_free.exe
      - name: commit exe to site
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add nametag_free.exe
          git commit -m "free download: nametag_free.exe"
          git push
      - uses: actions/upload-artifact@v4
        with: { name: nametag, path: dist/ }
