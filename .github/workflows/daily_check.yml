name: 아침 점검 (가게 자동 점검)

on:
  schedule:
    - cron: '0 22 * * *'      # 매일 한국시간 오전 7시
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 검사 도구 준비
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: 가게 점검
        id: check
        continue-on-error: true
        run: python daily_check.py

      - name: 문제가 있으면 알림 글 올리기
        if: steps.check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '점검 프로그램이 아예 실행되지 못했습니다.';
            try { body = fs.readFileSync('점검결과.txt', 'utf8'); } catch (e) {}
            const today = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[밸류스] 아침 점검에서 문제를 찾았어요 (${today})`,
              body: [
                '아래 항목을 확인해 주세요.',
                '',
                '```',
                body,
                '```',
                '',
                `자세한 기록: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                '- 결제창이 안 열린다면: Paddle > Checkout settings > Default payment link 칸부터 확인하세요.',
                '- 가격이 다르다면: prices.json 을 기준으로 홈페이지와 Paddle 을 맞추세요.',
                '- 설치파일 조각이 빠졌다면: dist 가지에 그 조각을 다시 올리세요.'
              ].join('\n')
            });

      - name: 문제가 있으면 빨간불로 끝내기
        if: steps.check.outcome == 'failure'
        run: exit 1
