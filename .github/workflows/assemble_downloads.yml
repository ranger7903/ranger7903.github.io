name: assemble-downloads

# 설치파일이 커서 웹으로 한 번에 못 올린다.
# 조각으로 나눠 올린 뒤, 여기서 다시 붙이고 원본과 같은지 확인한 다음
# 조각은 지우고 완성된 파일만 사이트에 남긴다.

on: { workflow_dispatch: {} }
permissions: { contents: write }

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 조각 확인
        run: ls -la download/parts

      - name: 다시 붙이기
        run: |
          set -e
          cd download
          cat parts/office_setup.exe.part* > valuestools_ai_office_setup.exe
          echo "valuestools_ai_office_setup.exe → $(stat -c%s valuestools_ai_office_setup.exe) 바이트"
          cat parts/office.exe.part* > valuestools_ai_office.exe
          echo "valuestools_ai_office.exe → $(stat -c%s valuestools_ai_office.exe) 바이트"

      - name: 원본과 같은지 확인 (다르면 여기서 멈춘다)
        run: |
          cd download
          cat > 확인.txt <<'EOF'
          784baa9c3523b37acee251d24b3dd2c5a9a9a58275eaee1c5b6b6df6aa23ec68  valuestools_ai_office_setup.exe
          04067473e365b93afd52a6864f7f1860740c354dfaca4c3d6a764caa4804d626  valuestools_ai_office.exe
          EOF
          sha256sum -c 확인.txt
          rm 확인.txt

      - name: 조각 지우고 완성본만 남기기
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git rm -r --quiet download/parts
          git add download/valuestools_ai_office_setup.exe download/valuestools_ai_office.exe
          git commit -m "내려받기: v3.1 설치파일 2개 조립 완료 (조각 정리)"
          git push

      - name: 결과
        run: ls -la download
