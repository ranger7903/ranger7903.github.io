name: assemble-downloads

# 설치파일이 커서 웹으로 한 번에 못 올린다.
# 조각으로 나눠 올린 뒤, 여기서 다시 붙이고 원본과 같은지 확인한 다음
# 조각은 지우고 완성된 파일만 사이트에 남긴다.

on: { workflow_dispatch: {} }
permissions: { contents: write }

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 조각 확인
        run: ls -la download/parts

      - name: 다시 붙이기
        run: |
          set -e
          cd download
          for name in valuestools_ai_office_setup.exe valuestools_ai_office.exe; do
            cat parts/$name.part* > "$name"
            echo "$name  →  $(stat -c%s "$name") 바이트"
          done

      - name: 원본과 같은지 확인 (다르면 여기서 멈춘다)
        run: |
          cd download
          cat > 확인.txt <<'EOF'
          8c3a48199c74df787e35fd06992eed62a0df5ae4c253c63f738e4336bf102727  valuestools_ai_office_setup.exe
          62da4e29ba73fa391c7fd1c7d7859a5e85898bce3788188efb29460b2428efa8  valuestools_ai_office.exe
          EOF
          sha256sum -c 확인.txt
          rm 확인.txt

      - name: 조각 지우고 완성본만 남기기
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git rm -r --quiet download/parts
          git add download/valuestools_ai_office_setup.exe download/valuestools_ai_office.exe
          git commit -m "내려받기: v3.0 설치파일 2개 조립 완료 (조각 정리)"
          git push

      - name: 결과
        run: ls -la download
