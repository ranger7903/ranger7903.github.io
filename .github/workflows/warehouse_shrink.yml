name: 창고 줄이기

# 몇 달에 한 번 눌러 주세요.
#  - 홈페이지가 지금 쓰는 조각이 전부 멀쩡한지 지문까지 확인하고
#  - 아무도 안 쓰는 파일을 버리고
#  - 창고에 쌓인 '옛날 판 기록'을 한 덩이로 접습니다.
# 어긋난 곳이 하나라도 있으면 거기서 멈추고 창고는 그대로 둡니다.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "무엇을 할까요? (그냥 두면 연습이라 아무것도 안 바뀝니다)"
        type: choice
        required: true
        default: "연습만 - 살펴보고 보고서만"
        options:
          - "연습만 - 살펴보고 보고서만"
          - "진짜로 창고 줄이기"

jobs:
  shrink:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 홈페이지(main) 받기
        uses: actions/checkout@v4
        with:
          ref: main
          path: main_repo

      - name: 창고(dist) 받기
        uses: actions/checkout@v4
        with:
          ref: dist
          path: dist_repo
          fetch-depth: 0

      - name: 지금 창고 크기 재기
        run: |
          echo "== 줄이기 전 =="
          echo "옛날 판까지 쌓인 기록: $(du -sh dist_repo/.git | cut -f1)"
          echo "지금 놓여 있는 파일  : $(du -sh --exclude=.git dist_repo | cut -f1)"

      - name: 손님이 받는 파일이 멀쩡한지 확인
        run: |
          python3 main_repo/warehouse_shrink.py \
            --main main_repo --dist dist_repo \
            --buril buril.txt --report report.txt

      - name: 보고서 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 창고-보고서
          path: report.txt
          if-no-files-found: ignore

      - name: 안 쓰는 파일 버리고 한 덩이로 접기
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -e
          cd dist_repo
          git config user.name "warehouse-shrink"
          git config user.email "actions@users.noreply.github.com"

          gone=0
          while IFS= read -r f; do
            if [ -n "$f" ] && [ -f "$f" ]; then
              rm -f -- "$f"
              gone=$((gone+1))
            fi
          done < ../buril.txt
          echo "버린 파일: ${gone}개"

          git checkout --orphan fresh_dist
          git add -A
          git commit -q -m "창고 줄이기: 지금 쓰는 파일만 한 덩이로"

          echo "== 줄인 뒤 (새 덩이 기준) =="
          git count-objects -vH | grep -E "size-pack|count" || true

          case "$MODE" in
            *진짜*)
              echo ">> 진짜로 밀어 넣습니다."
              git push --force origin fresh_dist:dist
              echo "REALLY=yes" >> $GITHUB_ENV
              ;;
            *)
              echo ">> 연습입니다. 밀어 넣는 시늉만 합니다 (창고는 그대로)."
              git push --force --dry-run origin fresh_dist:dist
              echo "REALLY=no" >> $GITHUB_ENV
              ;;
          esac

      - name: 줄인 창고를 다시 받아서 또 확인
        if: env.REALLY == 'yes'
        run: |
          set -e
          rm -rf check_repo
          git clone --depth 1 -b dist \
            https://github.com/${{ github.repository }}.git check_repo
          python3 main_repo/warehouse_shrink.py \
            --main main_repo --dist check_repo \
            --buril buril2.txt --report report2.txt
          echo "== 다시 확인 통과 =="
          echo "줄인 뒤 기록 크기: $(du -sh check_repo/.git | cut -f1)"

      - name: 다시 확인 보고서 보관
        if: always() && env.REALLY == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: 창고-보고서-줄인뒤
          path: report2.txt
          if-no-files-found: ignore
