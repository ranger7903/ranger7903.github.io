<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doctor Visit Prep — one clear page to show your doctor</title>
<meta name="description" content="Write down your symptoms, medicines, allergies and questions, then show the doctor one clear page — headings in 15 languages. Private, offline, no account.">
<!--
  Doctor Visit Prep (Valuestools, 2026-11-16 first build). Product key name: doctorprep.
  Customer: anyone going to a doctor, especially travellers and expats who don't speak the local language.
   · Notes: main problem, symptoms (dated updates, 0-10), medicines, allergies, conditions, questions.
   · Visit sheet: one page to print (A4/Letter) or hold up on the phone. Headings + tap-chips are translated;
     the patient's own text is never machine-translated and the page says so.
   · No diagnosis, no advice. Emergency line + a few emergency numbers.
   · Free: 1 person, 1 current sheet, English + 1 other heading language.
     Paid: family profiles, all 15 languages, visit history, backup file.
   · Data only on this device (localStorage).
-->
<link rel="manifest" href="doctorprep_manifest.json">
<meta name="theme-color" content="#1F5B63">
<link rel="icon" href="doctorprep_icon192.png">
<script src="nacl.min.js"></script>
<style>
:root{--bg:#F6F8F7;--card:#fff;--ink:#1F2A2C;--ink2:#5E6B6D;--line:#D9E2E1;--deep:#1F5B63;--accent:#C2553A;--ok:#2F6B45;--okbg:#E7F2EA;--bad:#A23A2A;--badbg:#FBE9E5;--warnbg:#FFF4D6;--warnline:#E3C463}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;font-size:17px;line-height:1.45}
main{max-width:640px;margin:0 auto;padding:12px 14px 48px}
header{display:flex;align-items:center;gap:8px;margin:4px 0 10px}
header h1{font-size:20px;margin:0;flex:1;min-width:0}
header h1 small{display:block;font-size:13px;font-weight:400;color:var(--ink2)}
button{font:inherit;cursor:pointer;color:inherit}
input,textarea,select{font:inherit;font-size:16px;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;width:100%;max-width:100%}
textarea{resize:vertical;min-height:44px}
label{display:block;font-size:14px;color:var(--ink2);margin:10px 0 4px}
.icon{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;font-size:15px;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.card h2{font-size:17px;margin:0 0 6px;display:flex;align-items:center;gap:8px}
.card h2 .n{font-size:13px;font-weight:400;color:var(--ink2);flex:1}
.big{display:block;width:100%;border:none;border-radius:14px;padding:14px;font-size:17px;font-weight:700;background:var(--deep);color:#fff;margin-top:12px}
.big.alt{background:#fff;color:var(--deep);border:1px solid var(--deep)}
.big.red{background:var(--bad)}
.small{border:1px solid var(--deep);background:#fff;color:var(--deep);border-radius:999px;padding:6px 12px;font-size:14px}
.small.solid{background:var(--deep);color:#fff}
.small.danger{border-color:var(--bad);color:var(--bad)}
.row{display:flex;gap:8px;align-items:center}
.row > *{min-width:0}
.grow{flex:1}
.muted{color:var(--ink2);font-size:13px}
.item{display:flex;gap:8px;align-items:flex-start;border-top:1px solid var(--line);padding:8px 0}
.item:first-of-type{border-top:none}
.item .t{flex:1;min-width:0;overflow-wrap:anywhere}
.item .t b{display:block}
.x{border:none;background:none;color:var(--ink2);font-size:20px;line-height:1;padding:2px 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:15px}
.chip.on{border:2px solid var(--deep);background:#E5F0F0;font-weight:600}
.emer{background:var(--badbg);border:1px solid #E7B9AE;border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0}
.emer b{color:var(--bad)}
.emer table{border-collapse:collapse;margin-top:6px;font-size:14px}
.emer td{padding:2px 10px 2px 0;vertical-align:top}
.emer td:first-child{font-weight:700;white-space:nowrap}
.note{background:var(--warnbg);border:1px solid var(--warnline);border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0}
.sev{display:inline-block;min-width:44px;text-align:center;border-radius:8px;padding:1px 6px;font-weight:700;font-size:14px;background:#EEF2F2}
.sev.h{background:#F7D9D1;color:#7E2414}.sev.m{background:#FBEBC8;color:#6B4A00}.sev.l{background:#DDEFE2;color:#1E5532}
input[type=range]{padding:0;border:none;height:34px;accent-color:var(--deep)}
.modal{position:fixed;inset:0;background:rgba(20,30,32,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal .card{max-width:460px;width:100%;max-height:90vh;overflow:auto}
footer{text-align:center;color:var(--ink2);font-size:13px;margin-top:22px}
a{color:var(--deep)}

/* ───── Visit sheet ───── */
.tool{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 10px}
.tool select{width:auto;flex:1;min-width:150px}
.sheet{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;font-size:16px;line-height:1.4;overflow-wrap:anywhere}
.sheet[lang=ja]{font-family:"Hiragino Sans","Yu Gothic UI","Yu Gothic","Meiryo","Noto Sans JP","Noto Sans CJK JP",sans-serif}
.sheet[lang=ko]{font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",sans-serif}
.sheet[lang=zh]{font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC","Noto Sans CJK SC",sans-serif}
.sheet[lang=ar]{font-family:"Segoe UI","Geeza Pro","Noto Naskh Arabic","Noto Sans Arabic",Tahoma,sans-serif}
.sheet[lang=hi]{font-family:"Nirmala UI","Kohinoor Devanagari","Noto Sans Devanagari","Mangal",sans-serif}
.sheet[lang=th]{font-family:"Leelawadee UI","Thonburi","Noto Sans Thai","Tahoma",sans-serif}
.sheet .en{font-size:.72em;color:#667;font-weight:400}
.sheet h3 .en{margin-inline-start:6px}
.sh-top .ttl .en{display:block;margin:0}
.sheet td .en{white-space:nowrap}
.sh-top{border-bottom:3px solid var(--deep);padding-bottom:8px;margin-bottom:10px}
.sh-top .ttl{font-size:1.3em;font-weight:800;color:var(--deep)}
.sh-meta{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:6px}
.sh-meta span b{font-weight:600;color:#445}
.sheet h3{font-size:1.02em;margin:12px 0 4px;color:var(--deep);border-bottom:1px solid var(--line);padding-bottom:2px;break-after:avoid}
.sheet .sec{break-inside:avoid}
.sheet .main{font-size:1.12em;font-weight:600}
.sheet table{width:100%;border-collapse:collapse}
.sheet th,.sheet td{text-align:start;vertical-align:top;padding:3px 6px;border-bottom:1px solid #EEF1F1}
.sheet th{font-size:.82em;color:#445;font-weight:600}
.sheet .sym{padding:4px 0 6px;border-bottom:1px solid #EEF1F1}
.sheet .sym .nm{font-weight:700}
.sheet .kv{display:block;padding-inline-start:12px}
.sheet .kv b{font-weight:600;color:#445}
.sheet .allergy{background:var(--badbg);border:2px solid var(--bad);border-radius:8px;padding:6px 10px;font-weight:700}
.sheet ol,.sheet ul{margin:2px 0;padding-inline-start:22px}
.sheet .foot{margin-top:12px;font-size:.78em;color:#556;border-top:1px solid var(--line);padding-top:6px}
.sheet .none{color:#778;font-style:italic}
.sheet.huge{font-size:21px}
.sheet.huge .en{font-size:.62em}

@media print{
  @page{margin:12mm}
  html,body{background:#fff}
  main{max-width:none;padding:0;margin:0}
  .noprint,header,.tool,.emer,.note,footer,.modal{display:none !important}
  .sheet{border:none;border-radius:0;padding:0;font-size:10pt;line-height:1.28}
  .sheet.huge{font-size:10pt}
  .sheet .sec{break-inside:auto}
  .sheet .sym{break-inside:avoid;padding:2px 0 3px}
  .sheet .sym .nm{display:inline;margin-inline-end:12px}
  .sheet .kv{display:inline;padding:0;margin-inline-end:12px}
  .sheet h3{margin:7px 0 3px}
  .sheet th,.sheet td{padding:1px 6px}
  .sheet tr{break-inside:avoid}
  .sh-top{padding-bottom:5px;margin-bottom:6px}
  .sheet .allergy{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sh-top{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<main id="app"></main>

// How-often choices (pre-translated)
const FREQ = {

// Tap-to-add symptom words (pre-translated)

// ───────── Helpers ─────────
const $ = s => document.querySelector(s);
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function todayISO(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function clampSev(v){ v = parseInt(v, 10); return isNaN(v) ? 0 : Math.max(0, Math.min(10, v)); }
function sevCls(v){ return v >= 7 ? 'h' : v >= 4 ? 'm' : 'l'; }
function langName(c){ const l = LANGS.find(x => x[0] === c); return l ? (l[0] === 'en' ? 'English' : l[1] + ' — ' + l[2]) : c; }

// ───────── License key (same scheme as every Valuestools app) ─────────
const PUB_B64 = 'z7ZM1qUvab0B9bVoMhT75prsEn3g2rq1EhrE6ZFnogk=';
const LKEY = 'vt_doctorprep_lic';
let LIC = null;
try { LIC = JSON.parse(localStorage.getItem(LKEY) || 'null'); } catch (e) {}
function licensed(){ return !!(LIC && LIC.ok); }
function b64d(s){ s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '=';
  const bin = atob(s), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
function verifyKey(raw){
  try {
    raw = (raw || '').trim().replace(/\s+/g, '');
    if (!raw.startsWith('VALUES.')) return 'bad';
    const p = raw.split('.'); if (p.length !== 3) return 'bad';
    if (typeof nacl === 'undefined') return 'nonacl';
    const payload = b64d(p[1]), sig = b64d(p[2]);
    if (!nacl.sign.detached.verify(payload, sig, b64d(PUB_B64))) return 'bad';
    const info = JSON.parse(new TextDecoder().decode(payload));
    const prods = info.p || [];
    if (!(prods.indexOf('*') >= 0 || prods.indexOf('doctorprep') >= 0)) return 'noprod';
    return info;
  } catch (e) { return 'bad'; }
}

// ───────── Storage ─────────
const KEY = 'vt_doctorprep_v1';
function newPerson(){ return {id:uid(), name:'', age:'', problem:'', syms:[], meds:[], allergies:[], nka:false, conds:[], qs:[], history:[]}; }
let S = {people:[], cur:null, lang:'es', freeLang:null, big:false};
try { const x = JSON.parse(localStorage.getItem(KEY) || 'null'); if (x && Array.isArray(x.people)) S = Object.assign(S, x); } catch (e) {}
if (!S.people.length) { const p = newPerson(); S.people.push(p); S.cur = p.id; }
let saveFail = false;
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); saveFail = false; } catch (e) { saveFail = true; } }
function P(){ let p = S.people.find(x => x.id === S.cur); if (!p || (!licensed() && p !== S.people[0])) { p = S.people[0]; S.cur = p.id; } return p; }
function langOK(c){ return c === 'en' || licensed() || c === S.freeLang; }

// ───────── Labels ─────────
function symLabel(s, l){
  if (s.chip === 'pain' && s.area) return SYM.pain[l] + colon(l) + AREA[s.area][l];
  if (s.chip && SYM[s.chip]) return SYM[s.chip][l];
  return '';
}
function symName(s){ return symLabel(s, 'en') || s.text || 'Symptom'; }
function freqLabel(m, l){ return m.fk && FREQ[m.fk] ? FREQ[m.fk][l] : ''; }
function latest(s){ const a = s.log.slice().sort((x, y) => x.d < y.d ? -1 : x.d > y.d ? 1 : 0); return a.length ? a[a.length - 1] : null; }
function first(s){ const a = s.log.slice().sort((x, y) => x.d < y.d ? -1 : x.d > y.d ? 1 : 0); return a.length ? a[0] : null; }

function listCard(k, title, ph, hint){
  const p = P(), a = p[k];
  let h = '<div class="card" id="c_' + k + '"><h2>' + title + ' <span class="n">' + a.length + '</span></h2>';
  if (k === 'allergies') h += '<label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" id="nka" style="width:auto"' + (p.nka ? ' checked' : '') + (a.length ? ' disabled' : '') + '> I have no known allergies</label>';
  if (!a.length) h += '<p class="muted">' + hint + '</p>';
  a.forEach((t, i) => h += '<div class="item"><div class="t">' + esc(t) + '</div><button class="x" aria-label="Remove" data-del="' + k + ':' + i + '">×</button></div>');
  if (!(k === 'allergies' && p.nka)) h += '<div class="row" style="margin-top:6px"><input id="in_' + k + '" placeholder="' + esc(ph) + '" class="grow" maxlength="2000"><button class="small solid" id="add_' + k + '">Add</button></div>';
  return h + '</div>';
}
function wireList(k){
  const p = P(), inp = $('#in_' + k);
  if (inp) {
    const add = () => { const v = inp.value.trim(); if (!v) { inp.focus(); return; } p[k].push(v); if (k === 'allergies') p.nka = false; save(); render(home); setTimeout(() => { const e = $('#in_' + k); if (e) { e.focus(); } }, 0); };
    $('#add_' + k).onclick = add;
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); add(); } });
  }
  document.querySelectorAll('[data-del^="' + k + ':"]').forEach(b => b.onclick = () => { p[k].splice(+b.dataset.del.split(':')[1], 1); save(); render(home); });
}

      '<button class="big alt" id="sup">+ Add an update</button><button class="big alt red" id="sdel" style="background:#fff;color:var(--bad);border-color:var(--bad)">Delete this symptom</button>' : '') +

    $('#sup').onclick = () => { pull(); save(); updEdit(s.id); };
    $('#sdel').onclick = () => ask('Delete “' + symName(s) + '” and all its updates?', 'Delete', () => { p.syms = p.syms.filter(x => x.id !== s.id); save(); render(home); });
    document.querySelectorAll('[data-dl]').forEach(b => b.onclick = () => { pull(); s.log = s.log.filter(x => x.id !== b.dataset.dl); save(); symEdit(s.id); });
  }
}
function updEdit(sid){
  view = () => updEdit(sid);
  const p = P(), s = p.syms.find(x => x.id === sid); if (!s) { render(home); return; }
  const L = latest(s); let sev = L ? L.sev : 3;
  $('#app').innerHTML = '<header><button class="icon" id="bk">←</button><h1>Update: ' + esc(symName(s)) + '</h1></header><div class="card">' +
    '<label for="ud">Date</label><input type="date" id="ud" value="' + todayISO() + '" max="' + todayISO() + '">' +
    '<label for="us">How bad is it? <b id="sevv">' + sev + '</b>/10 <span class="muted">(0 = none, 10 = worst imaginable)</span></label><input type="range" id="us" min="0" max="10" step="1" value="' + sev + '">' +
    '<label for="un">Anything new? (optional)</label><textarea id="un" rows="3" maxlength="4000" placeholder="e.g. fever 38.5 °C in the evening, slept badly"></textarea>' +
    '<button class="big" id="usave">Save update</button></div>';
  window.scrollTo(0, 0);
  $('#bk').onclick = () => render(home);
  $('#us').oninput = e => { sev = clampSev(e.target.value); $('#sevv').textContent = sev; };
  $('#usave').onclick = () => {
    let d = $('#ud').value || todayISO(); if (d > todayISO()) d = todayISO();
    s.log.push({id:uid(), d:d, sev:sev, note:$('#un').value.trim()});
    if (!s.start || d < s.start) s.start = d;
    save(); render(home);
  };
}

// ───────── Medicine editor ─────────
function medEdit(id){
  view = () => medEdit(id);
  const p = P();
  const m = id ? p.meds.find(x => x.id === id) : {id:uid(), name:'', dose:'', fk:'', ftext:''};
  const fH = () => Object.keys(FREQ).map(k => '<button class="chip' + (m.fk === k ? ' on' : '') + '" data-f="' + k + '">' + FREQ[k].en + '</button>').join('');
  $('#app').innerHTML = '<header><button class="icon" id="bk">←</button><h1>' + (id ? 'Edit medicine' : 'Add a medicine') + '</h1></header><div class="card">' +
    '<label for="mn">Name (as on the box — brand names differ between countries, so add the active ingredient if you know it)</label><input id="mn" maxlength="500" value="' + esc(m.name) + '" placeholder="e.g. Ibuprofen (Advil)">' +
    '<label for="md">Dose</label><input id="md" maxlength="500" value="' + esc(m.dose) + '" placeholder="e.g. 400 mg">' +
    '<label>How often — tap one (translated for the doctor)</label><div class="chips" id="fchips">' + fH() + '</div>' +
    '<label for="mf">…or in your own words / extra detail</label><input id="mf" maxlength="500" value="' + esc(m.ftext) + '" placeholder="e.g. every morning with food">' +
    '<p id="mmsg" class="muted" style="color:var(--bad)"></p><button class="big" id="msave">Save</button>' +
    (id ? '<button class="big alt" id="mdel" style="color:var(--bad);border-color:var(--bad)">Delete this medicine</button>' : '') + '</div>';
  window.scrollTo(0, 0);
  $('#bk').onclick = () => render(home);
  $('#fchips').onclick = e => { const b = e.target.closest('[data-f]'); if (!b) return; m.fk = m.fk === b.dataset.f ? '' : b.dataset.f; $('#fchips').innerHTML = fH(); };
  $('#msave').onclick = () => {
    m.name = $('#mn').value.trim(); m.dose = $('#md').value.trim(); m.ftext = $('#mf').value.trim();
    if (!m.name) { $('#mmsg').textContent = 'Please write the medicine’s name.'; return; }
    if (!id) p.meds.push(m);
    save(); render(home);
  };
  if (id) $('#mdel').onclick = () => ask('Delete “' + m.name + '”?', 'Delete', () => { p.meds = p.meds.filter(x => x.id !== m.id); save(); render(home); });
}

// ───────── Small dialog (in-page, no browser popups) ─────────
function ask(text, yes, onYes, extra){
  const d = document.createElement('div'); d.className = 'modal'; d.id = 'dlg';
  d.innerHTML = '<div class="card"><p>' + esc(text) + '</p>' + (extra || '') + '<button class="big" id="dyes">' + esc(yes) + '</button><button class="big alt" id="dno">Cancel</button></div>';
  document.body.appendChild(d);
  $('#dno').onclick = () => d.remove();
  $('#dyes').onclick = () => { d.remove(); onYes(); };
}

// ───────── Visit sheet ─────────
function sheetHTML(p, l, dateStr){
  const en = l !== 'en';
  const H = (k) => esc(T[k][l]) + (en ? ' <span class="en" lang="en" dir="ltr">' + esc(T[k].en) + '</span>' : '');
  const U = (t) => '<span dir="auto">' + esc(t) + '</span>';               // patient text, as typed
  const NONE = '<span class="none">' + esc(T.none[l]) + '</span>';
  const tr = (txt, entxt) => esc(txt) + (en && entxt ? ' <span class="en" lang="en" dir="ltr">(' + esc(entxt) + ')</span>' : '');
  let h = '<div class="sh-top"><div class="ttl">' + H('title') + '</div><div class="sh-meta">' +
    (p.name ? '<span><b>' + esc(T.name[l]) + colon(l) + '</b>' + U(p.name) + '</span>' : '') +
    (p.age ? '<span><b>' + esc(T.age[l]) + colon(l) + '</b>' + U(p.age) + '</span>' : '') +
    '<span><b>' + esc(T.date[l]) + colon(l) + '</b><span dir="ltr">' + esc(dateStr) + '</span></span></div></div>';
  const mainTxt = p.problem.trim() || (p.syms[0] ? (symLabel(p.syms[0], l) || p.syms[0].text) : '');
  h += '<div class="sec"><h3>' + H('main') + '</h3><div class="main">' + (mainTxt ? (p.problem.trim() ? U(p.problem) : (p.syms[0].chip ? tr(symLabel(p.syms[0], l), symLabel(p.syms[0], 'en')) : U(mainTxt))) : NONE) + '</div></div>';
  // symptoms
  h += '<div class="sec"><h3>' + H('symptoms') + '</h3>';
  if (!p.syms.length) h += NONE;
  p.syms.forEach(s => {
    const F = first(s), L = latest(s), lab = symLabel(s, l);
    h += '<div class="sym"><div class="nm">' + (lab ? tr(lab, symLabel(s, 'en')) : U(s.text)) + '</div>' +
      (lab && s.text ? '<span class="kv"><b>' + esc(T.details[l]) + colon(l) + '</b>' + U(s.text) + '</span>' : '') +
      (s.start ? '<span class="kv"><b>' + esc(T.started[l]) + colon(l) + '</b><span dir="ltr">' + esc(s.start) + '</span></span>' : '') +
      (L ? '<span class="kv"><b>' + esc(T.severity[l]) + colon(l) + '</b><span dir="ltr">' + (F && F !== L && F.sev !== L.sev ? F.sev + ' → ' : '') + L.sev + '/10</span></span>' : '') +
      (s.better ? '<span class="kv"><b>' + esc(T.better[l]) + colon(l) + '</b>' + U(s.better) + '</span>' : '') +
      (s.worse ? '<span class="kv"><b>' + esc(T.worse[l]) + colon(l) + '</b>' + U(s.worse) + '</span>' : '') + '</div>';
  });
  h += '</div>';
  // timeline
  const ev = [];
  // only symptoms tracked over several days (or with a note) — a single reading is already shown above
  p.syms.forEach(s => s.log.forEach(e => { if (s.log.length > 1 || e.note) ev.push({d:e.d, sev:e.sev, note:e.note, s:s}); }));
  ev.sort((a, b) => a.d < b.d ? -1 : a.d > b.d ? 1 : 0);
  if (ev.length) {
    h += '<div class="sec"><h3>' + H('timeline') + '</h3><table><tbody>' + ev.map(e =>
      '<tr><td style="white-space:nowrap"><span dir="ltr">' + esc(e.d) + '</span></td><td' + ((symLabel(e.s, l) || e.s.text).length <= 22 ? ' style="white-space:nowrap"' : '') + '>' + (symLabel(e.s, l) ? esc(symLabel(e.s, l)) : U(e.s.text)) + '</td><td style="white-space:nowrap"><span dir="ltr">' + e.sev + '/10</span></td><td style="width:55%">' + (e.note ? U(e.note) : '') + '</td></tr>').join('') + '</tbody></table></div>';
  }
  // medicines
  h += '<div class="sec"><h3>' + H('meds') + '</h3>';
  if (!p.meds.length) h += NONE;
  else h += '<table><thead><tr><th>' + esc(T.med[l]) + '</th><th>' + esc(T.dose[l]) + '</th><th>' + esc(T.freq[l]) + '</th></tr></thead><tbody>' + p.meds.map(m =>
    '<tr><td><b>' + U(m.name) + '</b></td><td' + (m.dose.length <= 14 ? ' style="white-space:nowrap"' : '') + '>' + U(m.dose) + '</td><td>' + (m.fk ? tr(freqLabel(m, l), freqLabel(m, 'en')) : '') + (m.ftext ? '<div dir="auto">' + esc(m.ftext) + '</div>' : '') + '</td></tr>').join('') + '</tbody></table>';
  h += '</div>';
  // allergies
  h += '<div class="sec"><h3>' + H('allergies') + '</h3>' + (p.allergies.length ? '<div class="allergy"><ul>' + p.allergies.map(a => '<li>' + U(a) + '</li>').join('') + '</ul></div>' :
    p.nka ? '<div>' + tr(T.nka[l], T.nka.en) + '</div>' : NONE) + '</div>';
  h += '<div class="sec"><h3>' + H('conds') + '</h3>' + (p.conds.length ? '<ul>' + p.conds.map(a => '<li>' + U(a) + '</li>').join('') + '</ul>' : NONE) + '</div>';
  h += '<div class="sec"><h3>' + H('questions') + '</h3>' + (p.qs.length ? '<ol>' + p.qs.map(a => '<li>' + U(a) + '</li>').join('') + '</ol>' : NONE) + '</div>';
  h += '<div class="foot">' + esc(T.note[l]) + (en ? '<br><span lang="en" dir="ltr">' + esc(T.note.en) + '</span>' : '') + '</div>';
  return h;
}
function sheetView(hist){
  view = () => sheetView(hist);
  const p = hist ? hist.p : P();
  let l = hist ? hist.lang : S.lang;
  if (!langOK(l)) l = S.freeLang && langOK(S.freeLang) ? S.freeLang : 'en';
  const opts = LANGS.map(x => '<option value="' + x[0] + '"' + (x[0] === l ? ' selected' : '') + '>' + esc(langName(x[0])) + (langOK(x[0]) ? '' : ' (full version)') + '</option>').join('');
  const dir = l === 'ar' ? 'rtl' : 'ltr';
  let h = '<header class="noprint"><button class="icon" id="bk">←</button><h1>' + (hist ? 'Past visit ' + esc(hist.date) : 'Visit sheet') + '<small>Show this to the doctor, or print it</small></h1></header>';
  h += '<div class="tool noprint"><label for="lang" style="margin:0;width:100%">Doctor’s language</label><select id="lang">' + opts + '</select>' +
    '<button class="small" id="big">' + (S.big ? 'Normal text' : 'Bigger text') + '</button><button class="small solid" id="prt">Print / PDF</button></div>';
  h += '<div class="note noprint"><b>Only the headings and the tap-to-add words are translated.</b> Everything you typed yourself is shown exactly as you wrote it — write it in the doctor’s language if you can, or keep it simple. ' +
    (!licensed() ? 'Free version: English + one other language' + (S.freeLang ? ' (' + esc(langName(S.freeLang)) + ')' : '') + '.' : '') + '</div>';
  h += '<div class="sheet' + (S.big ? ' huge' : '') + '" id="sheet" lang="' + l + '" dir="' + dir + '">' + sheetHTML(p, l, hist ? hist.date : todayISO()) + '</div>';
  if (!hist) h += '<button class="big alt noprint" id="savehist">Save this visit to history</button>';
  else h += '<button class="big alt noprint" id="delhist" style="color:var(--bad);border-color:var(--bad)">Delete this past visit</button>';
  h += '<div class="noprint">' + EMER + '</div>';
  $('#app').innerHTML = h;
  window.scrollTo(0, 0);
  $('#bk').onclick = () => hist ? historyView() : render(home);
  $('#prt').onclick = () => window.print();
  $('#big').onclick = () => { S.big = !S.big; save(); sheetView(hist); };
  $('#lang').onchange = e => {
    const c = e.target.value;
    if (langOK(c)) { if (hist) hist.lang = c; else { S.lang = c; save(); } sheetView(hist); return; }
    e.target.value = l;
    if (!licensed() && !S.freeLang) {
      ask('Use ' + langName(c) + ' as your free second language?', 'Yes, use ' + LANGS.find(x => x[0] === c)[1], () => { S.freeLang = c; S.lang = c; save(); sheetView(hist); },
        '<p class="muted">The free version includes English plus one other language, and this choice is kept. Switching to other languages needs the full version.</p>');
    } else { const en = x => LANGS.find(y => y[0] === x)[2]; unlockScreen(en(c) + ' is in the full version. Your free version includes English and ' + en(S.freeLang) + '.'); }
  };
  if (!hist) $('#savehist').onclick = () => {
    if (!licensed()) { unlockScreen('Visit history is part of the full version.'); return; }
    p.history.unshift({id:uid(), date:todayISO(), lang:l, snap:JSON.parse(JSON.stringify(Object.assign({}, p, {history:[]})))});
    save(); $('#savehist').textContent = 'Saved to history ✓'; $('#savehist').disabled = true;
  };
  else $('#delhist').onclick = () => ask('Delete the visit of ' + hist.date + '?', 'Delete', () => { const pp = P(); pp.history = pp.history.filter(x => x.id !== hist.id); save(); historyView(); });
}
function historyView(){
  view = historyView;
  if (!licensed()) { unlockScreen('Visit history is part of the full version.'); return; }
  const p = P();
  let h = '<header><button class="icon" id="bk">←</button><h1>Past visits<small>' + esc(p.name || 'You') + '</small></h1></header><div class="card">';
  if (!p.history.length) h += '<p class="muted">No past visits yet. On the visit sheet, tap “Save this visit to history” after your appointment.</p>';
  p.history.forEach(v => h += '<div class="item"><div class="t"><b>' + esc(v.date) + '</b><span class="muted">' + esc(v.snap.problem || (v.snap.syms[0] ? symName(v.snap.syms[0]) : '')) + '</span></div><button class="small" data-hv="' + v.id + '">Open</button></div>');
  $('#app').innerHTML = h + '</div>';
  $('#bk').onclick = () => menu();
  document.querySelectorAll('[data-hv]').forEach(b => b.onclick = () => { const v = p.history.find(x => x.id === b.dataset.hv); sheetView({id:v.id, date:v.date, lang:v.lang, p:v.snap}); });
}

// ───────── Menu, backup ─────────
function menu(){
  view = menu;
  const p = P();
  let h = '<header><button class="icon" id="bk">←</button><h1>Menu</h1></header>';
  h += '<div class="card"><h2>People</h2>' + S.people.map(x => '<div class="item"><div class="t"><b>' + esc(x.name || 'Unnamed') + (x.id === p.id ? ' <span class="muted">(open now)</span>' : '') + '</b></div>' +
    (x.id !== p.id && licensed() ? '<button class="small" data-op="' + x.id + '">Open</button>' : '') + (S.people.length > 1 ? '<button class="small danger" data-dp="' + x.id + '">Delete</button>' : '') + '</div>').join('') +
    '<button class="big alt" id="addp2">+ Add a person' + (licensed() ? '' : ' (full version)') + '</button></div>';
  h += '<div class="card"><h2>Past visits</h2><p class="muted">Keep each visit sheet and look back later.</p><button class="big alt" id="hist">Open past visits' + (licensed() ? '' : ' (full version)') + '</button></div>';
  h += '<div class="card"><h2>Backup</h2><p class="muted">Your notes live only in this browser. Save a backup file to keep them safe or move them to a new phone.</p>' +
    '<button class="big alt" id="exp">Save backup file' + (licensed() ? '' : ' (full version)') + '</button><button class="big alt" id="imp">Restore from backup file' + (licensed() ? '' : ' (full version)') + '</button>' +
    '<input type="file" id="impf" accept=".json,application/json" hidden><p id="bmsg" class="muted"></p></div>';
  h += '<div class="card"><h2>Clear notes</h2><p class="muted">Remove all notes for ' + esc(p.name || 'this person') + ' (for example after you are better).</p><button class="big alt" id="clr" style="color:var(--bad);border-color:var(--bad)">Clear these notes</button></div>';
  h += '<div class="card"><h2>Full version</h2>' + (licensed() ? '<p>Unlocked' + (LIC.n ? ' — thank you, ' + esc(LIC.n) : '') + '.</p>' : '<button class="big" id="unl2">Unlock the full version</button>') + '</div>';
  $('#app').innerHTML = h;
  $('#bk').onclick = () => render(home);
  $('#addp2').onclick = () => { if (!licensed()) { unlockScreen('Family profiles are part of the full version.'); return; } const n = newPerson(); S.people.push(n); S.cur = n.id; save(); render(home); };
  document.querySelectorAll('[data-op]').forEach(b => b.onclick = () => { S.cur = b.dataset.op; save(); render(home); });
  document.querySelectorAll('[data-dp]').forEach(b => b.onclick = () => { const x = S.people.find(y => y.id === b.dataset.dp);
    ask('Delete ' + (x.name || 'this person') + ' and all their notes and past visits?', 'Delete', () => { S.people = S.people.filter(y => y.id !== x.id); if (S.cur === x.id) S.cur = S.people[0].id; save(); menu(); }); });
  $('#hist').onclick = () => historyView();
  $('#exp').onclick = () => { if (!licensed()) { unlockScreen('The backup file is part of the full version.'); return; } exportBackup(); };
  $('#imp').onclick = () => { if (!licensed()) { unlockScreen('The backup file is part of the full version.'); return; } $('#impf').click(); };
  $('#impf').onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => importBackup(String(r.result)); r.readAsText(f); };
  $('#clr').onclick = () => ask('Clear all notes for ' + (p.name || 'this person') + '? Past visits are kept.', 'Clear', () => { Object.assign(p, {problem:'', syms:[], meds:[], allergies:[], nka:false, conds:[], qs:[]}); save(); render(home); });
  if ($('#unl2')) $('#unl2').onclick = () => unlockScreen();
}
function backupText(){ return JSON.stringify({app:'doctorprep', v:1, saved:new Date().toISOString(), data:S}, null, 1); }
function exportBackup(){
  const b = new Blob([backupText()], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'doctorprep-backup-' + todayISO() + '.json';
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  const m = $('#bmsg'); if (m) m.textContent = 'Backup file saved to your downloads.';
}
function importBackup(txt){
  let x; try { x = JSON.parse(txt); } catch (e) { x = null; }
  const m = $('#bmsg');
  if (!x || x.app !== 'doctorprep' || !x.data || !Array.isArray(x.data.people) || !x.data.people.length) { if (m) m.textContent = 'This file is not a Doctor Visit Prep backup.'; return false; }
  const n = x.data.people.length;
  ask('Replace the notes on this device with the backup (' + n + ' ' + (n === 1 ? 'person' : 'people') + ')?', 'Restore', () => {
    const def = newPerson();
    S = Object.assign({people:[], cur:null, lang:'es', freeLang:null, big:false}, x.data);
    S.people = S.people.map(p => Object.assign(newPerson(), p, {id:p.id || def.id}));
    S.cur = S.people[0].id; save(); render(home);
  });
  return true;
}

function render(v){ (v || view || home)(); }
render(view = home);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('doctorprep_sw.js');
</script>
</body>
</html>
