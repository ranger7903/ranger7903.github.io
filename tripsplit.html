<title>Trip Split — who paid what, who owes whom. Offline, no sign-up</title>
<meta name="description" content="Split shared trip expenses with friends or family. Works offline abroad, several currencies, fewest transfers to settle up. No account, no ads.">
<!--
  Trip Split (밸류스, 2026-11-16 첫 판)
  손님: 친구·가족과 여행하는 사람, 함께 사는 사람(전 세계). 그래서
   · 아무도 가입 안 함. 이 기기에만 저장. 외국에서 인터넷 없어도 됨.
   · 돈은 늘 «가장 작은 단위 정수»(센트·엔)로 셈 → 잃는 센트 없음, 합은 정확히 0.
   · 외화는 손님이 한 번 넣은 환율로 집 통화로 바꿈. 어떤 환율을 썼는지 늘 보여 줌.
   · 정산: 가장 적은 송금 수(작은 모임은 정확한 최소, 큰 모임은 n-1 이하).
   · 숫자: 소수점은 늘 점, 천 단위는 좁은 빈칸 → 어느 나라에서 읽어도 같은 뜻.
   · 무료: 여행 하나, 핵심 기능 전부(집 통화 하나로). 유료: 여행 여러 개·보관함, 외화 환산, CSV.
-->

<script>
'use strict';
const $ = s => document.querySelector(s);
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

// ───────── Currencies (ISO 4217 minor units) ─────────
const CURS = [
 ['USD','US dollar',2],['EUR','Euro',2],['GBP','British pound',2],['JPY','Japanese yen',0],['KRW','Korean won',0],['VND','Vietnamese dong',0],
 ['CNY','Chinese yuan',2],['HKD','Hong Kong dollar',2],['TWD','Taiwan dollar',2],['SGD','Singapore dollar',2],['THB','Thai baht',2],['MYR','Malaysian ringgit',2],
 ['IDR','Indonesian rupiah',2],['PHP','Philippine peso',2],['KHR','Cambodian riel',2],['LAK','Lao kip',2],['INR','Indian rupee',2],['LKR','Sri Lankan rupee',2],
 ['NPR','Nepalese rupee',2],['PKR','Pakistani rupee',2],['BDT','Bangladeshi taka',2],['AUD','Australian dollar',2],['NZD','New Zealand dollar',2],['FJD','Fijian dollar',2],
 ['CAD','Canadian dollar',2],['MXN','Mexican peso',2],['BRL','Brazilian real',2],['ARS','Argentine peso',2],['CLP','Chilean peso',0],['COP','Colombian peso',2],
 ['PEN','Peruvian sol',2],['CRC','Costa Rican colon',2],['CHF','Swiss franc',2],['SEK','Swedish krona',2],['NOK','Norwegian krone',2],['DKK','Danish krone',2],
 ['ISK','Icelandic krona',0],['PLN','Polish zloty',2],['CZK','Czech koruna',2],['HUF','Hungarian forint',2],['RON','Romanian leu',2],['BGN','Bulgarian lev',2],
 ['RSD','Serbian dinar',2],['TRY','Turkish lira',2],['GEL','Georgian lari',2],['UAH','Ukrainian hryvnia',2],['KZT','Kazakh tenge',2],['AED','UAE dirham',2],
 ['SAR','Saudi riyal',2],['QAR','Qatari riyal',2],['BHD','Bahraini dinar',3],['KWD','Kuwaiti dinar',3],['OMR','Omani rial',3],['JOD','Jordanian dinar',3],
 ['ILS','Israeli shekel',2],['EGP','Egyptian pound',2],['MAD','Moroccan dirham',2],['TND','Tunisian dinar',3],['ZAR','South African rand',2],['KES','Kenyan shilling',2],
 ['TZS','Tanzanian shilling',2],['UGX','Ugandan shilling',0],['RWF','Rwandan franc',0],['XOF','West African CFA franc',0],['XAF','Central African CFA franc',0],
 ['XPF','CFP franc',0],['PYG','Paraguayan guarani',0],['MNT','Mongolian tugrik',2],['MVR','Maldivian rufiyaa',2]
];
const CUR = {}; CURS.forEach(c => CUR[c[0]] = {name:c[1], dec:c[2]});
function DEC(c){ return CUR[c] ? CUR[c].dec : 2; }
function guessHome(){
  const m = {US:'USD',GB:'GBP',JP:'JPY',KR:'KRW',VN:'VND',CA:'CAD',AU:'AUD',NZ:'NZD',IN:'INR',CN:'CNY',TW:'TWD',HK:'HKD',SG:'SGD',CH:'CHF',SE:'SEK',NO:'NOK',DK:'DKK',PL:'PLN',CZ:'CZK',HU:'HUF',MX:'MXN',BR:'BRL',TH:'THB',PH:'PHP',ID:'IDR',MY:'MYR',ZA:'ZAR',TR:'TRY',IL:'ILS',AE:'AED',IS:'ISK',CL:'CLP'};
  const euro = 'AT BE CY DE EE ES FI FR GR HR IE IT LT LU LV MT NL PT SI SK'.split(' ');
  const r = ((navigator.language || 'en-US').split('-')[1] || '').toUpperCase();
  return m[r] || (euro.indexOf(r) >= 0 ? 'EUR' : 'USD');
}
function curOptions(sel, only){
  return CURS.filter(c => !only || only.indexOf(c[0]) >= 0).map(c => '<option value="' + c[0] + '"' + (c[0] === sel ? ' selected' : '') + '>' + c[0] + ' — ' + esc(c[1]) + '</option>').join('');
}

// ───────── Numbers: integers in the smallest unit, always ─────────
// Shown with a dot for decimals and a narrow space between thousands, so 1 234.50 reads the same everywhere.
const TS = ' ';
function fmtNum(minor, dec, sep){
  const neg = minor < 0; const a = Math.abs(minor); const p = Math.pow(10, dec);
  const ip = Math.floor(a / p), fp = a - ip * p;
  let s = String(ip).replace(/\B(?=(\d{3})+(?!\d))/g, sep == null ? TS : sep);
  if (dec) s += '.' + String(fp).padStart(dec, '0');
  return (neg ? '−' : '') + s;
}
function money(minor, cur){ return fmtNum(minor, DEC(cur)) + ' ' + cur; }
function plainNum(minor, dec){ return fmtNum(minor, dec, '').replace('−', '-'); }
// Parse what a person types. Accepts 1234.5, 1 234.50, 1,234.50, 1.234,50, 42,5. Returns {minor} or {err}.
function parseAmount(str, dec, cur){
  let s = String(str == null ? '' : str).trim().replace(/[\s  '’_]/g, '');
  if (!s) return {err:'Enter an amount.'};
  if (!/^[0-9.,]+$/.test(s) || !/[0-9]/.test(s)) return {err:'Use digits only, with a dot for decimals (for example 42.50).'};
  const ld = s.lastIndexOf('.'), lc = s.lastIndexOf(',');
  let dsep = null;
  if (ld >= 0 && lc >= 0) dsep = ld > lc ? '.' : ',';
  else if (ld >= 0 || lc >= 0) {
    const ch = ld >= 0 ? '.' : ',';
    const cnt = s.split(ch).length - 1, after = s.length - s.lastIndexOf(ch) - 1;
    if (cnt > 1) dsep = null;
    else if (after === 3 && dec !== 3) dsep = null;
    else dsep = ch;
  }
  let ip = s, fp = '';
  if (dsep) { const k = s.lastIndexOf(dsep); ip = s.slice(0, k); fp = s.slice(k + 1); }
  ip = ip.replace(/[.,]/g, '');
  if (/[.,]/.test(fp)) return {err:'That number has too many separators.'};
  if (fp.length > dec) return {err: dec === 0 ? (cur || 'This currency') + ' has no decimals — enter a whole number.' : (cur || 'This currency') + ' has ' + dec + ' decimals at most.'};
  ip = ip.replace(/^0+(?=\d)/, '') || '0';
  if (ip.length > 12) return {err:'That number is too large.'};
  return {minor: Number(ip) * Math.pow(10, dec) + Number((fp + '000').slice(0, dec) || 0)};
}
// Exchange rate typed once: "1 FOREIGN = v HOME" (dir h) or "1 HOME = v FOREIGN" (dir f). Kept as an exact fraction.
function parseRate(str){
  let s = String(str == null ? '' : str).trim().replace(/[\s  '’_]/g, '');
  if (!s) return {err:'Enter the exchange rate.'};
  if (!/^[0-9.,]+$/.test(s)) return {err:'Use digits only, with a dot for decimals.'};
  const ld = s.lastIndexOf('.'), lc = s.lastIndexOf(',');
  let dsep = null;
  if (ld >= 0 && lc >= 0) dsep = ld > lc ? '.' : ',';
  else if (ld >= 0) dsep = (s.split('.').length > 2) ? null : '.';
  else if (lc >= 0) dsep = (s.split(',').length > 2 || s.length - lc - 1 === 3) ? null : ',';
  let ip = s, fp = '';
  if (dsep) { const k = s.lastIndexOf(dsep); ip = s.slice(0, k); fp = s.slice(k + 1); }
  ip = ip.replace(/[.,]/g, '');
  if (/[.,]/.test(fp)) return {err:'That rate has too many separators.'};
  if (fp.length > 12 || ip.length > 12) return {err:'That rate has too many digits.'};
  ip = ip.replace(/^0+(?=\d)/, '') || '0';
  const num = BigInt(ip + fp), den = 10n ** BigInt(fp.length);
  if (num === 0n) return {err:'The rate must be more than zero.'};
  let t = (ip + (fp ? '.' + fp : '')); if (t.startsWith('.')) t = '0' + t;
  return {num, den, text:t};
}
function rateFrac(r){ // home per 1 foreign, as [n, d]
  const p = parseRate(r.v); if (p.err) return null;
  return r.dir === 'f' ? [p.den, p.num] : [p.num, p.den];
}
function rateText(cur, home, r){
  return r.dir === 'f' ? '1 ' + home + ' = ' + r.v + ' ' + cur : '1 ' + cur + ' = ' + r.v + ' ' + home;
}
function sigText(n, d, digits){ // fraction to a short decimal, for the "other way round" hint
  const x = Number(n) / Number(d); if (!isFinite(x) || x === 0) return '0';
  return x >= 1 ? String(Number(x.toPrecision(Math.max(digits, String(Math.floor(x)).length)))) : String(Number(x.toPrecision(digits)));
}
const MAXH = 1e14; // largest single expense after conversion, in the smallest unit (keeps every sum exact)
function convert(minor, fromCur, home, frac){ // round half up, exact
  if (fromCur === home) return minor;
  const [n, d] = frac;
  const num = BigInt(minor) * n * (10n ** BigInt(DEC(home)));
  const den = d * (10n ** BigInt(DEC(fromCur)));
  return Number((num * 2n + den) / (den * 2n));
}

// ───────── Splitting (largest remainder; the sum is always exact) ─────────
function allocate(total, weights, rot){
  const n = weights.length; const W = weights.reduce((a, b) => a + BigInt(b), 0n);
  if (W === 0n) return weights.map(() => 0);
  const T = BigInt(total); let left = T; const base = [], rem = [];
  for (let i = 0; i < n; i++) { const x = T * BigInt(weights[i]); base.push(x / W); rem.push(x % W); left -= x / W; }
  const order = weights.map((w, i) => i).filter(i => weights[i] > 0)
    .sort((a, b) => rem[b] > rem[a] ? 1 : rem[b] < rem[a] ? -1 : ((a - rot + n * 9) % n) - ((b - rot + n * 9) % n));
  for (let k = 0; left > 0n; k++, left--) base[order[k % order.length]] += 1n;
  return base.map(Number);
}
function hashRot(id, n){ let h = 0; for (const c of String(id)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return n ? h % n : 0; }
// Returns {own: {mid: minor in expense currency}, home: {mid: minor in home}, H, frac}
function splitExpense(t, e){
  const ids = t.members.map(m => m.id);
  let w;
  if (e.mode === 'exact') w = ids.map(id => e.parts[id] || 0);
  else w = ids.map(id => e.parts[id] || 0);
  const rot = hashRot(e.id, ids.length);
  const own = e.mode === 'exact' ? w.slice() : allocate(e.amt, w, rot);
  let frac = null, H = e.amt, homeArr = own;
  if (e.cur !== t.home) {
    frac = t.rates[e.cur] ? rateFrac(t.rates[e.cur]) : null;
    if (!frac) return null;
    H = convert(e.amt, e.cur, t.home, frac);
    homeArr = allocate(H, own, rot);
  }
  const o = {}, h = {}; ids.forEach((id, i) => { o[id] = own[i]; h[id] = homeArr[i]; });
  return {own:o, home:h, H, frac};
}
function balances(t){
  const b = {}, paid = {}, share = {}; t.members.forEach(m => { b[m.id] = 0; paid[m.id] = 0; share[m.id] = 0; });
  let total = 0;
  t.expenses.forEach(e => {
    const s = splitExpense(t, e); if (!s) return;
    total += s.H; b[e.payer] += s.H; paid[e.payer] += s.H;
    for (const id in s.home) { b[id] -= s.home[id]; share[id] += s.home[id]; }
  });
  t.payments.forEach(p => { b[p.from] += p.amt; b[p.to] -= p.amt; });
  return {b, paid, share, total};
}

// ───────── Settle up: fewest transfers ─────────
// Up to 14 people with a non-zero balance: exact minimum (split into as many zero-sum groups as possible).
// Bigger groups: greedy, never more than n-1 transfers.
function settleGroup(items, out){ // items [{id,v}] summing to 0; at most len-1 transfers
  const d = items.map(x => ({id:x.id, v:x.v})).filter(x => x.v !== 0);
  for (;;) {
    let mn = null, mx = null;
    d.forEach(x => { if (x.v < 0 && (!mn || x.v < mn.v)) mn = x; if (x.v > 0 && (!mx || x.v > mx.v)) mx = x; });
    if (!mn || !mx) break;
    const exact = d.find(x => x.v > 0 && x.v === -mn.v);
    const to = exact || mx; const a = Math.min(-mn.v, to.v);
    out.push({from:mn.id, to:to.id, amt:a}); mn.v += a; to.v -= a;
  }
  return out;
}
function settleGreedy(ids, bal){ return settleGroup(ids.map(id => ({id, v:bal[id]})), []); }
function settle(ids, bal){
  const nz = ids.filter(id => bal[id] !== 0);
  if (nz.length > 14) return settleGreedy(ids, bal);
  const n = nz.length, N = 1 << n, sum = new Float64Array(N), dp = new Int8Array(N);
  for (let m = 1; m < N; m++) { const lb = m & -m, i = 31 - Math.clz32(lb); sum[m] = sum[m ^ lb] + bal[nz[i]]; }
  for (let m = 1; m < N; m++) { let best = 0; for (let i = 0; i < n; i++) if (m & (1 << i)) { const v = dp[m ^ (1 << i)]; if (v > best) best = v; } dp[m] = best + (sum[m] === 0 ? 1 : 0); }
  // walk back to find the groups
  const groups = []; let m = N - 1, start = m;
  while (m) {
    let pick = -1, best = -1;
    for (let i = 0; i < n; i++) if (m & (1 << i)) { const v = dp[m ^ (1 << i)]; if (v > best) { best = v; pick = i; } }
    const nm = m ^ (1 << pick);
    if (sum[nm] === 0) { groups.push(start ^ nm); start = nm; }
    m = nm;
  }
  const out = [];
  groups.forEach(g => { const it = []; for (let i = 0; i < n; i++) if (g & (1 << i)) it.push({id:nz[i], v:bal[nz[i]]}); settleGroup(it, out); });
  return out;
}

// ───────── Free part and the license key ─────────
// Free: one trip with everything in its home currency. A Valuestools key (product «tripsplit», or «*») adds
// unlimited trips + archive, other currencies with exchange rates, and CSV export.
const PUB_B64 = 'z7ZM1qUvab0B9bVoMhT75prsEn3g2rq1EhrE6ZFnogk=';
const LKEY = 'vt_tripsplit_lic';
let LIC = null;
try { LIC = JSON.parse(localStorage.getItem(LKEY) || 'null'); } catch (e) {}
function licensed(){ return !!(LIC && LIC.ok); }
function b64d(s){ s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '=';
  const bin = atob(s), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
function verifyKey(raw){
  try {

    '<p class="muted">' + (licensed() ? 'Full version' + (LIC.n ? ' — registered to ' + esc(LIC.n) : '') + '.' : 'Free version: one trip, one currency. <a href="javascript:void(0)" onclick="needFull(null, about)">See the full version</a>') + '</p></div>';

function runSelf(){ const r = selfTest(400); $('#stout').innerHTML = (r.fails.length ? '<span class="neg">' + r.fails.length + ' problems: ' + esc(r.fails.slice(0, 3).join(' | ')) + '</span>' : '✓ All ' + r.checks + ' checks passed on ' + r.cases + ' random groups.'); }

// Unit-style checks of the money maths (run from About, and by the test script).
function rng(seed){ return () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function selfTest(N, seed){
  const R = rng(seed || 12345), ri = n => Math.floor(R() * n), pick = a => a[ri(a.length)];
  const fails = []; let checks = 0;
  const ok = (c, msg) => { checks++; if (!c) fails.push(msg); };
  // fixed cases
  ok(allocate(10000, [1, 1, 1], 0).join() === '3334,3333,3333', 'thirds of 100.00');
  ok(allocate(1000, [1, 1, 1], 0).reduce((a, b) => a + b) === 1000, 'thirds of 1000 JPY');
  ok(allocate(1000, [1, 1, 1], 0).join() === '334,333,333', 'JPY 1000/3 = 334,333,333');
  ok(allocate(7, [2, 1], 0).join() === '5,2' || allocate(7, [2, 1], 0).join() === '4,3', 'shares 2:1 of 7');
  ok(parseAmount('1,234.50', 2).minor === 123450, 'parse 1,234.50');
  ok(parseAmount('1.234,50', 2).minor === 123450, 'parse 1.234,50');
  ok(parseAmount('42,5', 2).minor === 4250, 'parse 42,5');
  ok(parseAmount('12 000', 0).minor === 12000, 'parse 12 000 JPY');
  ok(parseAmount('12.000', 0).minor === 12000, 'parse 12.000 JPY');
  ok(!!parseAmount('100.5', 0).err, 'JPY rejects decimals');
  ok(parseAmount('1.005', 2).minor === 100500, '1.005 EUR read as 1 005.00 (dot before 3 digits = thousands)');
  ok(parseAmount('1.005', 3).minor === 1005, '1.005 BHD');
  ok(convert(10000, 'EUR', 'JPY', [1625n, 10n]) === 16250, '100 EUR at 162.5 = 16 250 JPY');
  ok(convert(5000, 'JPY', 'USD', [1n, 150n]) === 3333, '5000 JPY at 1 USD=150 JPY = 33.33 USD');
  ok(convert(100000, 'KRW', 'VND', [18n, 1n]) === 1800000, 'KRW to VND');
  ok(fmtNum(1234567, 0).indexOf('.') < 0, '0-decimal format has no dot');
  ok(money(123450, 'EUR') === '1' + TS + '234.50 EUR', 'format 1 234.50 EUR');
  const codes = ['USD', 'EUR', 'JPY', 'KRW', 'VND', 'BHD', 'GBP', 'CLP'];
  let cases = 0;
  for (let c = 0; c < N; c++) {
    cases++;
    const n = 2 + ri(11);
    const t = {home:pick(codes), members:[], rates:{}, expenses:[], payments:[]};
    for (let i = 0; i < n; i++) t.members.push({id:'m' + i, name:'P' + i});
    codes.forEach(k => { if (k !== t.home) t.rates[k] = {dir:R() < 0.5 ? 'h' : 'f', v:((1 + ri(3000000)) / Math.pow(10, ri(6))).toFixed(6).replace(/\.?0+$/, '')}; });
    const ne = 1 + ri(15);
    for (let k = 0; k < ne; k++) {
      const cur = R() < 0.4 ? t.home : pick(codes), mag = Math.pow(10, 1 + ri(9));
      const e = {id:'e' + c + '_' + k, cur, amt:1 + ri(mag), payer:'m' + ri(n), mode:pick(['equal', 'exact', 'shares']), parts:{}, date:'2026-01-01'};
      const who = t.members.filter(() => R() < 0.6).map(m => m.id); if (!who.length) who.push('m' + ri(n));
      if (e.mode === 'equal') who.forEach(id => e.parts[id] = 1);
      else if (e.mode === 'shares') who.forEach(id => e.parts[id] = 1 + ri(500));
      else { let left = e.amt; who.forEach((id, i) => { const v = i === who.length - 1 ? left : ri(left + 1); e.parts[id] = v; left -= v; }); }
      t.expenses.push(e);
      if (cur !== t.home && convert(e.amt, cur, t.home, rateFrac(t.rates[cur])) > MAXH) { t.expenses.pop(); ok(true, ''); continue; } // the form refuses these
      const s = splitExpense(t, e);
      ok(!!s, 'split null');
      if (s) {
        ok(Object.values(s.own).reduce((a, b) => a + b, 0) === e.amt, 'own split sum ' + e.id);
        ok(Object.values(s.home).reduce((a, b) => a + b, 0) === s.H, 'home split sum ' + e.id);
        ok(Object.values(s.home).every(Number.isInteger) && Number.isInteger(s.H), 'integers ' + e.id);
        if (e.mode === 'equal') { const v = who.map(id => s.own[id]); ok(Math.max(...v) - Math.min(...v) <= 1, 'equal within 1 unit ' + e.id); }
      }
    }
    for (let k = ri(3); k > 0; k--) { const a = 'm' + ri(n), b = 'm' + ri(n); if (a !== b) t.payments.push({id:'p' + k, from:a, to:b, amt:1 + ri(100000)}); }
    const B = balances(t), ids = t.members.map(m => m.id);
    ok(ids.reduce((a, id) => a + B.b[id], 0) === 0, 'balances sum to zero, case ' + c);
    const tr = settle(ids, B.b), gr = settleGreedy(ids, B.b);
    const nz = ids.filter(id => B.b[id] !== 0).length;
    ok(tr.length <= Math.max(0, n - 1), 'at most n-1 transfers, case ' + c);
    ok(gr.length <= Math.max(0, n - 1), 'greedy at most n-1, case ' + c);
    ok(tr.length <= gr.length, 'exact minimum not worse than greedy, case ' + c);
    ok(nz === 0 ? tr.length === 0 : tr.length >= Math.ceil(nz / 2), 'lower bound, case ' + c);
    const after = Object.assign({}, B.b);
    tr.forEach(x => { ok(x.amt > 0 && Number.isInteger(x.amt) && x.from !== x.to, 'transfer valid, case ' + c); ok(B.b[x.from] < 0 && B.b[x.to] > 0, 'debtors pay creditors, case ' + c); after[x.from] += x.amt; after[x.to] -= x.amt; });
    ok(ids.every(id => after[id] === 0), 'settled to exactly zero, case ' + c);
    const g2 = Object.assign({}, B.b); gr.forEach(x => { g2[x.from] += x.amt; g2[x.to] -= x.amt; });
    ok(ids.every(id => g2[id] === 0), 'greedy settled to zero, case ' + c);
    if (DEC(t.home) === 0) tr.forEach(x => ok(money(x.amt, t.home).indexOf('.') < 0 && (x.amt >= 1e12 || parseAmount(fmtNum(x.amt, 0), 0).minor === x.amt), '0-decimal transfer, case ' + c));
    else tr.forEach(x => { if (x.amt < 1e12 * Math.pow(10, DEC(t.home))) ok(parseAmount(fmtNum(x.amt, DEC(t.home)), DEC(t.home)).minor === x.amt, 'format round trip, case ' + c); });
  }
  // big groups: greedy path
  for (let c = 0; c < 50; c++) {
    cases++;
    const n = 15 + ri(30), ids = [], bal = {}; let sum = 0;
    for (let i = 0; i < n; i++) { ids.push('b' + i); bal['b' + i] = ri(2000001) - 1000000; sum += bal['b' + i]; }
    bal['b0'] -= sum;
    const tr = settle(ids, bal); const after = Object.assign({}, bal); tr.forEach(x => { after[x.from] += x.amt; after[x.to] -= x.amt; });
    ok(tr.length <= n - 1, 'big group n-1, case ' + c); ok(ids.every(id => after[id] === 0), 'big group zero, case ' + c);
  }
  return {cases, checks, fails};
}

render(view = home);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('tripsplit_sw.js');
</script>
