<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<!-- 2026-09-02 안전장치 — 이 페이지는 "쉬는 중"입니다.
     옛 결제 방식(토스/샌드박스) 시절의 화면이라, 손님이 실수로 들어오면
     돈이 오가지 않는 가짜 결제 흐름을 보게 됩니다. 그래서 진짜 상점으로 자동으로 보냅니다.
     ▶ 다시 열 때: 바로 아래 자동이동 두 줄만 지우면 원래대로 돌아옵니다. -->
<script>location.replace('./#products');</script>
<noscript><meta http-equiv="refresh" content="0; url=./#products"></noscript>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>결제 실패 — 밸류스</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Gaegu:wght@400;700&display=swap">
<style>
:root{--cream:#FAF5EC;--card:#FFFDF8;--line:#E4D9C6;--ink:#41382E;--ink2:#6E6355;--terra:#C0684A;
 --shadow:0 2px 4px rgba(80,60,30,.05),0 18px 46px -30px rgba(80,60,30,.5)}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:"Gowun Dodum","Malgun Gothic",sans-serif;font-size:16px;line-height:1.85}
.shell{max-width:620px;margin:0 auto;padding:60px 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:36px 32px;text-align:center;position:relative}
.tape{position:absolute;top:-11px;left:50%;transform:translateX(-50%) rotate(2deg);width:110px;height:24px;background:#F0C8B8;opacity:.8;border-radius:2px}
.big{font-size:44px;margin:0 0 6px}
h1{font-family:"Gowun Batang",serif;font-size:24px;margin:0 0 12px}
p{color:var(--ink2);font-size:14.5px;margin:8px 0}
.box{background:#F4F0E6;border-radius:10px;padding:12px 16px;font-size:13px;color:var(--ink2);text-align:left;margin:18px 0;word-break:break-all}
a.btn{display:inline-block;background:var(--terra);color:#FFF8F2;text-decoration:none;border-radius:999px;padding:11px 26px;font-weight:700;margin-top:10px}
a.line{display:inline-block;border:1.5px solid var(--line);color:var(--ink2);text-decoration:none;border-radius:999px;padding:10px 24px;margin:10px 6px 0}
</style>
</head>
<body>
<div class="shell"><div class="card"><span class="tape"></span>
<div class="big">🧵</div>
<h1>결제가 되지 않았어요</h1>
<p>괜찮아요, 흔한 일이에요. 잠시 후 다시 해보시거나, 메일 주문을 이용해 주세요.</p>
<div class="box" id="detail"></div>
<a class="btn" id="retry" href="buy.html">다시 해보기</a>
<a class="line" href="mailto:ranger7903@nate.com">📮 메일로 주문하기</a>
<br><a class="line" href="./" style="border:none">← 가게로 돌아가기</a>
</div></div>
<script>
const q = new URLSearchParams(location.search);
document.getElementById('detail').textContent =
  `사유: ${q.get('message') || '알 수 없음'} (${q.get('code') || '-'})`;
const item = q.get('item');
if (item) document.getElementById('retry').href = 'buy.html?item=' + item;
</script>
</body>
</html>
