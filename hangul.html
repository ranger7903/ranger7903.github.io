<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hangul Steps — learn to read and speak Korean, from zero</title>
<meta name="description" content="Learn Korean from zero, in English. Read Hangul in an afternoon, then everyday phrases with sound. No account, no ads.">
<!--
  Hangul Steps (밸류스, 2026-11-16 첫 판)
  손님: 한국어를 처음 배우는 외국인(영어로 배우는 사람). 그래서
   · 화면 안내는 전부 영어. 한국어를 몰라도 길을 잃지 않는다.
   · 첫 단추: 이미 아는 외래어(바나나·버스·커피)를 스스로 읽어 내는 기쁨.
   · 모든 말에 소리(전화기·컴퓨터에 깔린 한국어 목소리) + 느리게 듣기.
   · 로마자는 보조 바퀴 — 설정에서 늘 / 누르면 / 안 보임.
   · 외국인이 실제로 걸리는 곳: ㄱ·ㅋ·ㄲ, ㅓ·ㅗ, 받침 7소리, 소리 바뀜(감사합니다 → 감사함니다).
   · 다음은 생활 말(카페·택시·가게·식당·도움)과 드라마 말, 간판 읽기.
   · 가입·광고·서버 없음. 진도는 이 기기에만.
-->
<link rel="manifest" href="hangul_manifest.json">
<meta name="theme-color" content="#1F4E79">

<script src="nacl.min.js"></script>
<style>
:root{--bg:#FBF8F3;--card:#fff;--ink:#2B2622;--ink2:#6B6259;--line:#E6DCCE;--accent:#C0603C;--deep:#1F4E79;--ok:#3E6B43;--okbg:#EAF1E6;--bad:#A8402F;--badbg:#F8E7E3}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:17px;line-height:1.5}
.ko{font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",sans-serif}
main{max-width:560px;margin:0 auto;padding:14px 14px 40px}
header{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
header h1{font-size:21px;margin:0;flex:1}
header h1 small{display:block;font-size:13px;font-weight:400;color:var(--ink2)}
button{font:inherit;cursor:pointer}
.icon{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.unit h2{font-size:17px;margin:0 0 4px}
.unit p{margin:0 0 8px;color:var(--ink2);font-size:14px}
.lesson{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;margin:6px 0}
.lesson .t{flex:1}
.lesson .t b{display:block;font-size:16px}
.lesson .t span{font-size:13px;color:var(--ink2)}
.lesson .s{font-size:14px;color:var(--ok);white-space:nowrap}
.lesson.next{border:2px solid var(--accent)}
.big{display:block;width:100%;border:none;border-radius:14px;padding:14px;font-size:17px;font-weight:700;background:var(--deep);color:#fff;margin-top:12px}
.big.alt{background:#fff;color:var(--deep);border:1px solid var(--deep)}
.big:disabled{opacity:.4}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0 12px}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.glyph{font-size:84px;text-align:center;line-height:1.15;margin:6px 0}
.glyph{word-break:keep-all}
.glyph.word{font-size:46px}
.glyph.phrase{font-size:30px;margin:14px 0}
.rom{text-align:center;color:var(--deep);font-size:20px;min-height:30px}
.rom.hidden{color:var(--ink2);font-size:14px;cursor:pointer;text-decoration:underline dotted}
.en{text-align:center;font-size:19px;font-weight:600}
.tip{background:#F4EEE5;border-radius:12px;padding:10px 12px;font-size:15px;margin-top:10px}
.say{display:flex;gap:8px;justify-content:center;margin:8px 0}
.say button{border:1px solid var(--deep);background:#fff;color:var(--deep);border-radius:999px;padding:8px 16px;font-size:16px}
.q{text-align:center;font-size:15px;color:var(--ink2);margin-bottom:4px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.choices.one{grid-template-columns:1fr}
.choice{border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px 8px;font-size:19px;min-height:58px}
.choice.k{font-size:30px}
.choice.right{background:var(--okbg);border-color:var(--ok)}
.choice.wrong{background:var(--badbg);border-color:var(--bad)}
.fb{margin-top:12px;border-radius:12px;padding:10px 12px;font-size:15px;display:none}
.fb.good{display:block;background:var(--okbg)}
.fb.bad{display:block;background:var(--badbg)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}
.tile{width:56px;height:56px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:28px}
.tile.on{border:2px solid var(--accent);background:#FFF4EE}
.slot{width:110px;height:110px;margin:6px auto;border:2px dashed var(--line);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:70px}
.sign{display:inline-block;background:#1D5C3A;color:#fff;border-radius:10px;padding:10px 22px;font-size:40px;font-weight:700;letter-spacing:2px}
.center{text-align:center}
.warn{background:#FFF4D6;border:1px solid #E8C96A;border-radius:12px;padding:10px 12px;font-size:14px}
.muted{color:var(--ink2);font-size:13px}
footer{text-align:center;color:var(--ink2);font-size:13px;margin-top:26px}
label.opt{display:flex;align-items:center;gap:8px;margin:8px 0}
select{font:inherit;padding:6px;border-radius:8px;border:1px solid var(--line)}
.done{font-size:54px;text-align:center}
</style>
</head>
<body>
<main id="app"></main>
<script>
'use strict';
// ───────── Hangul tables ─────────
const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ'.split('');

const JUNG_R = ['a','ae','ya','yae','eo','e','yeo','ye','o','wa','wae','oe','yo','u','wo','we','wi','yu','eu','ui','i'];
function syl(c, v){ return String.fromCharCode(0xAC00 + (CHO.indexOf(c) * 21 + JUNG.indexOf(v)) * 28); }
function sylRom(c, v){ return CHO_R[CHO.indexOf(c)] + JUNG_R[JUNG.indexOf(v)]; }
const FAMILY = {'ㄱ':'ㄱㅋㄲ','ㅋ':'ㄱㅋㄲ','ㄲ':'ㄱㅋㄲ','ㄷ':'ㄷㅌㄸ','ㅌ':'ㄷㅌㄸ','ㄸ':'ㄷㅌㄸ','ㅂ':'ㅂㅍㅃ','ㅍ':'ㅂㅍㅃ','ㅃ':'ㅂㅍㅃ',
  'ㅈ':'ㅈㅊㅉ','ㅊ':'ㅈㅊㅉ','ㅉ':'ㅈㅊㅉ','ㅅ':'ㅅㅆ','ㅆ':'ㅅㅆ','ㄴ':'ㄴㄹ','ㄹ':'ㄴㄹ','ㅁ':'ㅁㅂ','ㅇ':'ㅇㅎ','ㅎ':'ㅇㅎ'};
const VFAM = {'ㅓ':'ㅓㅗ','ㅗ':'ㅗㅓㅜ','ㅜ':'ㅜㅡㅗ','ㅡ':'ㅡㅜ','ㅐ':'ㅐㅔ','ㅔ':'ㅔㅐ','ㅏ':'ㅏㅓ','ㅣ':'ㅣㅡ',
  'ㅕ':'ㅕㅛ','ㅛ':'ㅛㅕㅠ','ㅠ':'ㅠㅛ','ㅑ':'ㅑㅕ','ㅘ':'ㅘㅝ','ㅝ':'ㅝㅘ','ㅚ':'ㅚㅙㅞ','ㅙ':'ㅙㅚㅞ','ㅞ':'ㅞㅚㅙ','ㅟ':'ㅟㅢ','ㅢ':'ㅢㅟ','ㅒ':'ㅒㅖ','ㅖ':'ㅖㅒ'};
const BASIC_V = 'ㅏㅓㅗㅜㅡㅣ'.split('');
const BASIC_C = 'ㄱㄴㄷㄹㅁㅂㅅㅇㅈㅎ'.split('');

// ───────── Course ─────────
// letter: {g: shown glyph, s: syllable to say, r: romanization, tip}
// word:   {ko, r, en, note}
const COURSE = [
 {unit:'Read Hangul', blurb:'Korean letters are a small, logical set. Most people can read them after an afternoon.', lessons:[
  {id:'v1', title:'Six vowels', sub:'ㅏ ㅓ ㅗ ㅜ ㅡ ㅣ', intro:'Every Korean syllable is a little block. A block always starts with a consonant — when a syllable starts with a vowel sound, Korean writes ㅇ in front as a silent placeholder. So 아 is just “a”.',
   letters:[
    {g:'ㅏ', s:'아', r:'a', tip:'“a” as in father. The short stroke points out, to the right.'},
    {g:'ㅓ', s:'어', r:'eo', tip:'Like the “u” in cup, mouth a little more open. Romanized “eo” — it is one sound, not two.'},
    {g:'ㅗ', s:'오', r:'o', tip:'“o” as in go, lips rounded — but with no “w” sound at the end. The stroke points up.'},
    {g:'ㅜ', s:'우', r:'u', tip:'“oo” as in moon. The stroke points down.'},
    {g:'ㅡ', s:'으', r:'eu', tip:'Say “oo” but keep your lips flat and spread, like a grimace. A flat line = flat lips.'},
    {g:'ㅣ', s:'이', r:'i', tip:'“ee” as in see. A standing line.'}],
   cons:['ㅇ'], vows:BASIC_V},
  {id:'c1', title:'First consonants', sub:'ㄱ ㄴ ㄷ ㄹ ㅁ', intro:'The consonant shapes are pictures of your mouth. ㄱ is the back of the tongue lifting, ㄴ is the tongue tip touching behind the teeth, ㅁ is the closed lips. Vowels that stand tall (ㅏ ㅓ ㅣ) go on the right; flat ones (ㅗ ㅜ ㅡ) go underneath.',
   letters:[
    {g:'ㄱ', s:'가', r:'g / k', tip:'Between g and k. At the start of a word it often sounds closer to k.'},
    {g:'ㄴ', s:'나', r:'n', tip:'Just like n.'},
    {g:'ㄷ', s:'다', r:'d / t', tip:'Between d and t. Think of ㄴ with a lid on top.'},
    {g:'ㄹ', s:'라', r:'r / l', tip:'A quick light flap, like the “tt” in American “butter”. At the end of a syllable it is an “l”.'},
    {g:'ㅁ', s:'마', r:'m', tip:'Just like m. It looks like a closed mouth.'}],
   cons:'ㄱㄴㄷㄹㅁ'.split(''), vows:BASIC_V, build:true},
  {id:'c2', title:'Five more consonants', sub:'ㅂ ㅅ ㅇ ㅈ ㅎ', intro:'With these five you can already read hundreds of syllables.',
   letters:[
    {g:'ㅂ', s:'바', r:'b / p', tip:'Between b and p. Looks like a little bucket.'},
    {g:'ㅅ', s:'사', r:'s', tip:'Like s — it pictures a tooth. Before ㅣ it sounds like “sh”: 시 is “shi”.'},
    {g:'ㅇ', s:'아', r:'(silent) / ng', tip:'Silent at the start of a block. At the bottom of a block it is “ng”, as in sing.'},
    {g:'ㅈ', s:'자', r:'j', tip:'Between j and ch, softer than English j.'},
    {g:'ㅎ', s:'하', r:'h', tip:'Just like h.'}],
   cons:BASIC_C, vows:BASIC_V, build:true},
  {id:'w1', title:'Words you already know', sub:'Read them yourself', intro:'Korean borrows many English words. Using only the letters you have learned, try to read each one before you look at the answer.',
   words:[
    {ko:'바나나', r:'banana', en:'banana'}, {ko:'버스', r:'beoseu', en:'bus', note:'Korean adds a soft “eu” where English has a consonant cluster: bus → 버스.'},
    {ko:'라디오', r:'radio', en:'radio'}, {ko:'오디오', r:'odio', en:'audio'}, {ko:'비자', r:'bija', en:'visa', note:'Korean has no v, so v becomes ㅂ.'},
    {ko:'소스', r:'soseu', en:'sauce'}, {ko:'아이디어', r:'aidieo', en:'idea'}, {ko:'사이즈', r:'saijeu', en:'size', note:'Korean has no z, so z becomes ㅈ.'},
    {ko:'드라마', r:'deurama', en:'TV drama'}, {ko:'미니', r:'mini', en:'mini'}, {ko:'시리즈', r:'sirijeu', en:'series'}]},
  {id:'c3', title:'Letters with a puff of air', sub:'ㅋ ㅌ ㅍ ㅊ · ㅐ ㅔ', intro:'Add a stroke, add a puff of air: ㄱ→ㅋ, ㄷ→ㅌ, ㅂ→ㅍ, ㅈ→ㅊ. Hold your hand in front of your mouth — you should feel the air. This difference changes meaning in Korean.',
   letters:[

    {g:'ㅍ', s:'파', r:'p', tip:'A strong p with a puff of air. Korean also uses it for English f: coffee → 커피.'},
    {g:'ㅊ', s:'차', r:'ch', tip:'A strong ch with a puff of air.'},
    {g:'ㅐ', s:'애', r:'ae', tip:'“e” as in bed.'},
    {g:'ㅔ', s:'에', r:'e', tip:'Also “e” as in bed. Most young speakers say ㅐ and ㅔ the same — you learn which one by the word.'}],
   cons:'ㄱㅋㄷㅌㅂㅍㅈㅊ'.split(''), vows:'ㅏㅓㅗㅜㅣㅐㅔ'.split(''), build:true,
   words:[
    {ko:'커피', r:'keopi', en:'coffee'}, {ko:'카메라', r:'kamera', en:'camera'}, {ko:'피자', r:'pija', en:'pizza'}, {ko:'토마토', r:'tomato', en:'tomato'},
    {ko:'치즈', r:'chijeu', en:'cheese'}, {ko:'케이크', r:'keikeu', en:'cake'}, {ko:'파티', r:'pati', en:'party'}, {ko:'테니스', r:'teniseu', en:'tennis'},
    {ko:'피아노', r:'piano', en:'piano'}, {ko:'카레', r:'kare', en:'curry'}]},
  {id:'c4', title:'Tight letters', sub:'ㄲ ㄸ ㅃ ㅆ ㅉ', intro:'A doubled letter is said with a tight throat and no puff of air — like the k in “skate” (not “kate”). So Korean has three kinds: 가 (plain), 카 (airy), 까 (tight). Listen to them side by side.',
   letters:[
    {g:'ㄲ', s:'까', r:'kk', tip:'Tight k, no air.'}, {g:'ㄸ', s:'따', r:'tt', tip:'Tight t, no air.'},
    {g:'ㅃ', s:'빠', r:'pp', tip:'Tight p, no air.'}, {g:'ㅆ', s:'싸', r:'ss', tip:'A sharp, tense s.'}, {g:'ㅉ', s:'짜', r:'jj', tip:'Tight j, no air.'}],
   cons:'ㄱㅋㄲㄷㅌㄸㅂㅍㅃㅈㅊㅉㅅㅆ'.split(''), vows:'ㅏㅗㅣ'.split(''),
   words:[
    {ko:'아빠', r:'appa', en:'dad'}, {ko:'오빠', r:'oppa', en:'older brother (said by a woman)'}, {ko:'싸다', r:'ssada', en:'cheap'},
    {ko:'비싸다', r:'bissada', en:'expensive'}, {ko:'짜다', r:'jjada', en:'salty'}, {ko:'토끼', r:'tokki', en:'rabbit'}, {ko:'아저씨', r:'ajeossi', en:'mister (a middle-aged man)'}]},
  {id:'c5', title:'Y and W vowels', sub:'ㅑ ㅕ ㅛ ㅠ · ㅘ ㅝ ㅚ ㅟ ㅢ', intro:'One extra stroke adds a “y”: ㅏ→ㅑ (ya). Two vowels side by side glide together with a “w”: ㅗ+ㅏ = ㅘ (wa).',
   letters:[
    {g:'ㅑ', s:'야', r:'ya', tip:'y + ㅏ'}, {g:'ㅕ', s:'여', r:'yeo', tip:'y + ㅓ'}, {g:'ㅛ', s:'요', r:'yo', tip:'y + ㅗ'}, {g:'ㅠ', s:'유', r:'yu', tip:'y + ㅜ'},
    {g:'ㅘ', s:'와', r:'wa', tip:'ㅗ + ㅏ'}, {g:'ㅝ', s:'워', r:'wo', tip:'ㅜ + ㅓ'}, {g:'ㅚ', s:'외', r:'oe / we', tip:'Today it sounds like “we”. ㅙ and ㅞ sound almost the same.'},
    {g:'ㅟ', s:'위', r:'wi', tip:'“wee”'}, {g:'ㅢ', s:'의', r:'ui', tip:'ㅡ gliding into ㅣ. In the middle of words it often becomes just “i”.'}],
   cons:'ㅇㄴㅁㅅㄱ'.split(''), vows:'ㅑㅕㅛㅠㅘㅝㅟ'.split(''),
   words:[
    {ko:'메뉴', r:'menyu', en:'menu'}, {ko:'유튜브', r:'yutyubeu', en:'YouTube'}, {ko:'요가', r:'yoga', en:'yoga'}, {ko:'뉴스', r:'nyuseu', en:'news'},
    {ko:'와이파이', r:'waipai', en:'Wi-Fi'}, {ko:'샤워', r:'syawo', en:'shower'}, {ko:'주스', r:'juseu', en:'juice'}, {ko:'여기', r:'yeogi', en:'here'},
    {ko:'의사', r:'uisa', en:'doctor'}, {ko:'회사', r:'hoesa', en:'company, office'}, {ko:'뭐', r:'mwo', en:'what'}]},
  {id:'b1', title:'Letters at the bottom', sub:'받침 — only 7 end sounds', intro:'A consonant under the vowel closes the syllable (it is called 받침, batchim). However it is spelled, it ends in one of only seven sounds: k, n, t, l, m, p, ng. And when the next syllable starts with ㅇ, the bottom letter slides over: 한국어 is said han-gu-geo.',
   letters:[
    {g:'각', s:'각', r:'-k', tip:'ㄱ ㅋ ㄲ at the bottom → a stopped k.'}, {g:'안', s:'안', r:'-n', tip:'ㄴ → n'},
    {g:'앗', s:'앗', r:'-t', tip:'ㄷ ㅅ ㅆ ㅈ ㅊ ㅌ ㅎ at the bottom → a stopped t. Seven spellings, one sound!'},
    {g:'알', s:'알', r:'-l', tip:'ㄹ → l'}, {g:'암', s:'암', r:'-m', tip:'ㅁ → m'}, {g:'압', s:'압', r:'-p', tip:'ㅂ ㅍ → a stopped p.'}, {g:'앙', s:'앙', r:'-ng', tip:'ㅇ → ng'}],
   words:[
    {ko:'한국', r:'hanguk', en:'Korea'}, {ko:'김치', r:'gimchi', en:'kimchi'}, {ko:'밥', r:'bap', en:'rice, a meal'}, {ko:'물', r:'mul', en:'water'},
    {ko:'서울', r:'seoul', en:'Seoul'}, {ko:'사랑', r:'sarang', en:'love'}, {ko:'택시', r:'taeksi', en:'taxi'}, {ko:'핸드폰', r:'haendeupon', en:'mobile phone'},
    {ko:'인터넷', r:'inteonet', en:'internet'}, {ko:'맛있어요', r:'masisseoyo', en:'It’s delicious', note:'The ㅅ slides over: 마-시-써-요.'},
    {ko:'감사합니다', r:'gamsahamnida', en:'Thank you', note:'Written 합니다 but said 함니다: ㅂ before ㄴ turns into m. Spelling and sound differ here — trust your ears.'}]}
 ]},
 {unit:'Everyday Korean', blurb:'Short, polite sentences that work with anyone. The polite ending -요 / -니다 is always safe with strangers.', lessons:[
  {id:'p1', title:'Hello and thank you', sub:'The words you use every day', words:[
    {ko:'안녕하세요', r:'annyeonghaseyo', en:'Hello', note:'Any time of day, with anyone.'},
    {ko:'감사합니다', r:'gamsahamnida', en:'Thank you'},
    {ko:'고맙습니다', r:'gomapseumnida', en:'Thank you (a little warmer)', note:'Just as polite as 감사합니다.'},
    {ko:'네', r:'ne', en:'Yes', note:'Also “okay”, “I see”. Sometimes it sounds like “de”.'},
    {ko:'아니요', r:'aniyo', en:'No'},
    {ko:'죄송합니다', r:'joesonghamnida', en:'I’m sorry (formal)'},
    {ko:'괜찮아요', r:'gwaenchanayo', en:'It’s okay / I’m fine / No, thanks', note:'One of the most useful words in Korean.'},
    {ko:'안녕히 가세요', r:'annyeonghi gaseyo', en:'Goodbye (to someone who is leaving)', note:'“Go in peace” — you stay, they go.'},
    {ko:'안녕히 계세요', r:'annyeonghi gyeseyo', en:'Goodbye (when you are the one leaving)', note:'“Stay in peace” — you go, they stay.'},
    {ko:'잘 먹겠습니다', r:'jal meokgetseumnida', en:'(said before eating)', note:'Roughly “I will eat well” — a thank-you for the meal.'}]},
  {id:'p2', title:'At a café', sub:'Order without pointing', words:[
    {ko:'아메리카노 하나 주세요', r:'amerikano hana juseyo', en:'One americano, please', note:'___ 주세요 means “___, please”. It works for almost anything.'},
    {ko:'아이스로 주세요', r:'aiseuro juseyo', en:'Iced, please'},
    {ko:'여기서 먹을게요', r:'yeogiseo meogeulgeyo', en:'For here'},
    {ko:'가져갈게요', r:'gajyeogalgeyo', en:'To go'},
    {ko:'얼마예요?', r:'eolmayeyo?', en:'How much is it?'},
    {ko:'카드 돼요?', r:'kadeu dwaeyo?', en:'Can I pay by card?'},

function today(){ const d = new Date(); return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); }
function dayNum(){ return Math.floor(Date.now() / 86400000); }
const GAPS = [0, 1, 3, 7, 14, 30];
function mark(id, ok){
  const c = S.cards[id] || {box:0, due:0};
  c.box = ok ? Math.min(c.box + 1, GAPS.length - 1) : 0;
  c.due = dayNum() + (ok ? GAPS[c.box] : 0);
  S.cards[id] = c;
  if (S.days.indexOf(today()) < 0) { S.days.push(today()); if (S.days.length > 400) S.days.shift(); }
}
function streak(){
  let n = 0, d = new Date();
  for (;;) { const k = d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
    if (S.days.indexOf(k) < 0) { if (n === 0 && d.toDateString() === new Date().toDateString()) { d.setDate(d.getDate() - 1); continue; } break; }
    n++; d.setDate(d.getDate() - 1); }
  return n;
}

let L = null, cards = [], ci = 0;
function startLesson(id){
  const want = LESSONS.find(l => l.id === id);
  if (locked(want)) { unlockScreen(want); return; }
  L = want;
  cards = [];
  if (L.intro) cards.push({kind:'text'});
  (L.letters || []).forEach(x => cards.push({kind:'letter', x}));
  (L.words || []).forEach(x => cards.push({kind:'word', x}));
  ci = 0; view = showCard; render();
}
function showCard(){
  const c = cards[ci];
  let h = '<header><button class="icon" onclick="render(view=home)">✕</button><h1 style="font-size:17px">' + esc(L.title) + '</h1></header><div class="bar"><i style="width:' + Math.round(ci / cards.length * 100) + '%"></i></div><div class="card">';
  if (c.kind === 'text') h += '<p>' + esc(L.intro) + '</p>';
  else if (c.kind === 'letter') {
    h += '<div class="glyph ko">' + esc(c.x.g) + '</div>' + (c.x.s !== c.x.g ? '<div class="center muted ko">as in ' + esc(c.x.s) + '</div>' : '') +
      '<div class="rom">' + esc(c.x.r) + '</div>' + sayBtns(c.x.s) + '<div class="tip">' + esc(c.x.tip) + '</div>';
    setTimeout(() => say(c.x.s), 250);
  } else {
    const w = c.x;
    h += (L.sign ? '<div class="center"><span class="sign ko">' + esc(w.ko) + '</span></div>' : '<div class="glyph ko ' + (w.ko.length > 5 ? 'phrase' : 'word') + '">' + esc(w.ko) + '</div>') +
      (L.id === 'w1' || L.id === 'c3' ? '<div class="rom hidden" onclick="this.className=\'en\';this.textContent=' + esc(JSON.stringify(w.en + ' · ' + w.r)) + '">Try to read it — then tap to check</div>'
        : romHtml(w.r) + '<div class="en">' + esc(w.en) + '</div>') +
      sayBtns(w.ko) + (w.note ? '<div class="tip">' + esc(w.note) + '</div>' : '');
    if (!(L.id === 'w1' || L.id === 'c3')) setTimeout(() => say(w.ko), 250);
  }
  h += '<button class="big" onclick="ci++;if(ci<cards.length)render();else startQuiz()">' + (ci + 1 < cards.length ? 'Next' : 'Practice now') + '</button></div>';
  $('#app').innerHTML = h;
}

// ───────── Questions ─────────
function wordQs(L, words, all){
  const qs = [], pool = all || words;
  words.forEach(w => {
    const id = 'w:' + w.ko;
    qs.push({id, prompt:(L && L.sign) ? 'What does this sign mean?' : 'What does this mean?', show:w.ko, sign:L && L.sign, ans:w.en, opts:choices(w.en, pool.map(x => x.en)), sayAfter:w.ko, note:w.r});
    if (VOICE) qs.push({id, prompt:'Listen. Which one did you hear?', listen:w.ko, ans:w.ko, opts:choices(w.ko, pool.map(x => x.ko)), k:true, note:w.en});
    qs.push({id, prompt:'How do you say it in Korean?', showEn:w.en, ans:w.ko, opts:choices(w.ko, pool.map(x => x.ko)), k:true, sayAfter:w.ko, note:w.r});
  });
  return qs;
}
function letterQs(L){
  const qs = [];
  (L.letters || []).forEach(x => {
    qs.push({id:'l:' + x.g, prompt:'How does it sound?', show:x.g, ans:x.r, opts:choices(x.r, L.letters.map(y => y.r)), sayAfter:x.s});
  });
  if (L.cons && L.vows) {
    for (let i = 0; i < 8; i++) {
      const c = pick(L.cons), v = pick(L.vows), s = syl(c, v), r = sylRom(c, v);
      const near = [];
      (FAMILY[c] || c).split('').forEach(c2 => { if (L.cons.indexOf(c2) >= 0) near.push(syl(c2, v)); });
      (VFAM[v] || v).split('').forEach(v2 => { if (L.vows.indexOf(v2) >= 0) near.push(syl(c, v2)); });
      L.cons.forEach(c2 => near.push(syl(c2, v))); L.vows.forEach(v2 => near.push(syl(c, v2)));
      const opts = choices(s, uniq(near));
      if (VOICE && i % 2 === 0) qs.push({id:null, prompt:'Listen. Which syllable is it?', listen:s, ans:s, opts, k:true, note:r});
      else qs.push({id:null, prompt:'How do you read it?', show:s, ans:r || '(silent) ' + JUNG_R[JUNG.indexOf(v)], opts:opts.map(o => { const n = o.charCodeAt(0) - 0xAC00; return CHO_R[Math.floor(n / 588)] + JUNG_R[Math.floor((n % 588) / 28)]; }), sayAfter:s});
    }
    if (L.build) for (let i = 0; i < 3; i++) { const c = pick(L.cons.filter(x => x !== 'ㅇ')), v = pick(L.vows); qs.push({build:true, c, v, prompt:'Build the syllable “' + sylRom(c, v) + '”'}); }
  }
  return qs;
}
let Q = [], qi = 0, score = 0, wrongs = 0, mode = 'lesson', answered = false, bc = null, bv = null;
function startQuiz(){
  mode = 'lesson';
  let qs = letterQs(L).concat(L.words ? wordQs(L, L.words) : []);
  qs = shuffle(qs).slice(0, 12);
  // letters first in the very first lesson feels gentler
  Q = qs; qi = 0; score = 0; wrongs = 0; view = showQ; render();
}
function startReview(){
  mode = 'review';
  const ids = shuffle(dueItems()).slice(0, 15);
  const allWords = []; LESSONS.forEach(l => (l.words || []).forEach(w => allWords.push(Object.assign({sign:l.sign}, w))));
  const allLetters = []; LESSONS.forEach(l => (l.letters || []).forEach(x => allLetters.push(x)));
  const qs = [];
  ids.forEach(id => {
    if (id.startsWith('w:')) { const w = allWords.find(x => 'w:' + x.ko === id); if (w) qs.push(pick(wordQs(w.sign ? {sign:true} : null, [w], allWords))); }
    else if (id.startsWith('l:')) { const x = allLetters.find(y => 'l:' + y.g === id); if (x) qs.push({id, prompt:'How does it sound?', show:x.g, ans:x.r, opts:choices(x.r, allLetters.map(y => y.r)), sayAfter:x.s}); }
  });
  if (!qs.length) { render(view = home); return; }
  Q = qs; qi = 0; score = 0; wrongs = 0; L = {title:'Review'}; view = showQ; render();
}
function showQ(){
  const q = Q[qi]; answered = false; bc = bv = null;
  let h = '<header><button class="icon" onclick="render(view=home)">✕</button><h1 style="font-size:17px">' + esc(L.title) + '</h1></header><div class="bar"><i style="width:' + Math.round(qi / Q.length * 100) + '%"></i></div><div class="card">';
  h += '<div class="q">' + esc(q.prompt) + '</div>';
  if (q.build) {
    const cs = uniq([q.c].concat((FAMILY[q.c] || '').split('').filter(x => L.cons.indexOf(x) >= 0), shuffle(L.cons.filter(x => x !== 'ㅇ')))).filter(x => CHO.indexOf(x) >= 0).slice(0, 4);
    const vs = uniq([q.v].concat((VFAM[q.v] || '').split('').filter(x => L.vows.indexOf(x) >= 0), shuffle(L.vows))).slice(0, 4);
    h += '<div class="slot ko" id="slot"></div><div class="tiles ko">' + shuffle(cs).map(c => '<button class="tile" data-c="' + c + '">' + c + '</button>').join('') + '</div>' +
      '<div class="tiles ko">' + shuffle(vs).map(v => '<button class="tile" data-v="' + v + '">' + v + '</button>').join('') + '</div>' +
      '<button class="big" id="chk" disabled>Check</button>';
  } else {
    if (q.listen) { h += sayBtns(q.listen); setTimeout(() => say(q.listen), 300); }
    if (q.show) h += q.sign ? '<div class="center" style="margin:10px 0"><span class="sign ko">' + esc(q.show) + '</span></div>' : '<div class="glyph ko' + (q.show.length > 5 ? ' phrase' : q.show.length > 2 ? ' word' : '') + '">' + esc(q.show) + '</div>';
    if (q.showEn) h += '<div class="en" style="font-size:22px;margin:16px 0">' + esc(q.showEn) + '</div>';
    const longOpt = q.opts.some(o => o.length > 14);
    h += '<div class="choices' + (longOpt ? ' one' : '') + '">' + q.opts.map((o, i) => '<button class="choice' + (q.k ? ' k ko' : '') + '" data-i="' + i + '">' + esc(o) + '</button>').join('') + '</div>';
  }
  h += '<div class="fb" id="fb"></div><button class="big" id="nx" style="display:none">Next</button></div>';
  $('#app').innerHTML = h;
  if (q.build) {
    document.querySelectorAll('.tile').forEach(b => b.onclick = () => {
      if (answered) return;
      if (b.dataset.c) { bc = b.dataset.c; document.querySelectorAll('[data-c]').forEach(x => x.classList.toggle('on', x === b)); }
      else { bv = b.dataset.v; document.querySelectorAll('[data-v]').forEach(x => x.classList.toggle('on', x === b)); }
      $('#slot').textContent = bc && bv ? syl(bc, bv) : (bc || bv || '');
      $('#chk').disabled = !(bc && bv);
    });
    $('#chk').onclick = () => { $('#chk').style.display = 'none'; finish(bc === q.c && bv === q.v, syl(q.c, q.v), syl(q.c, q.v)); };
  } else {
    document.querySelectorAll('.choice').forEach(b => b.onclick = () => {
      if (answered) return;
      const ok = q.opts[+b.dataset.i] === q.ans;
      b.classList.add(ok ? 'right' : 'wrong');
      if (!ok) document.querySelectorAll('.choice').forEach(x => { if (q.opts[+x.dataset.i] === q.ans) x.classList.add('right'); });
      finish(ok, q.ans, q.sayAfter || q.listen);
    });
  }
}
function finish(ok, right, sayIt){
  answered = true;
  const q = Q[qi];
  if (ok) score++; else { wrongs++; if (mode === 'lesson' && !q.build) Q.push(Object.assign({}, q, {opts:shuffle(q.opts)})); }
  if (q.id) mark(q.id, ok);
  save();
  const fb = $('#fb');
  fb.className = 'fb ' + (ok ? 'good' : 'bad');
  fb.innerHTML = (ok ? '✓ Right!' : '✗ Not quite. The answer is <b class="ko">' + esc(right) + '</b>.') + (q.note ? ' <span class="muted">(' + esc(q.note) + ')</span>' : '');
  if (sayIt) say(sayIt);
  const nx = $('#nx'); nx.style.display = 'block';
  nx.onclick = () => { qi++; if (qi < Q.length) render(); else result(); };
}
function result(){
  view = result;
  const total = score + wrongs, pct = total ? score / total : 1;
  const stars = pct >= 0.9 ? 3 : pct >= 0.7 ? 2 : 1;
  if (mode === 'lesson') { S.done[L.id] = Math.max(S.done[L.id] || 0, stars); (L.letters || []).forEach(x => { if (!S.cards['l:' + x.g]) mark('l:' + x.g, true); }); (L.words || []).forEach(w => { if (!S.cards['w:' + w.ko]) mark('w:' + w.ko, true); }); save(); }
  const nx = nextLesson();
  let h = '<div class="card center"><div class="done">' + (mode === 'lesson' ? '★'.repeat(stars) + '☆'.repeat(3 - stars) : '✓') + '</div>' +
    '<h2>' + (mode === 'lesson' ? 'Lesson done!' : 'Review done!') + '</h2><p>' + score + ' right out of ' + total + '.' +
    (L.id === 'w1' ? ' You just read Korean words on your own.' : '') + '</p>' +
    (mode === 'lesson' ? '<p class="muted">These words will come back in Review when it’s time — that is how they stick.</p>' : '') +
    (nx && mode === 'lesson' ? '<button class="big" onclick="startLesson(\'' + nx.id + '\')">Next: ' + esc(nx.title) + '</button>' : '') +
    '<button class="big alt" onclick="render(view=home)">Back to all lessons</button></div>';
  $('#app').innerHTML = h;
}
render(view = home);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('hangul_sw.js');
</script>
