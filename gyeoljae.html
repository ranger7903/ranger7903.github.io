<!DOCTYPE html>

<title>결재요망! — 공문 결재 놀이 · 밸류스</title>
<meta name="description" content="결재판에 올라온 공문을 도장 찍거나 반려하는 작은 놀이. 붙임 빠짐·날짜 거꾸로·결재선 잘못 같은 흠을 찾아내세요. 받을 것도 가입할 것도 없이 웹에서 바로.">
<style>

  .공문 th{background:#f2eee2; width:76px; font-weight:700; color:#4a4436; white-space:nowrap}
  .공문 h2{font-size:16px; margin:12px 0 8px; text-align:center}
  .공문 .몸{font-size:14px; white-space:pre-line; margin-bottom:12px}
  .공문 .붙임{font-size:13px; margin-bottom:12px}
  .공문 .끝인사{text-align:center; font-size:15px; font-weight:700; letter-spacing:2px; margin:14px 0 10px}
  .공문 .발신{text-align:center; font-size:16px; font-weight:800; letter-spacing:3px; margin:10px 0}
  .공문 .꼬리{border-top:1px solid var(--줄); padding-top:8px; font-size:11.5px; color:var(--흐림)}
  .결재칸{display:flex; gap:0; margin:0 0 10px; border:1px solid var(--줄); font-size:11.5px}
  .결재칸 div{flex:1; border-right:1px solid var(--줄); text-align:center}
  .결재칸 div:last-child{border-right:0}
  .결재칸 .머리{background:#f2eee2; padding:3px 0; font-weight:700}
  .결재칸 .속{height:34px; display:flex; align-items:center; justify-content:center; color:var(--흐림)}

         border-top:1px solid var(--줄)}

      color:#fff; cursor:pointer}

  .큰.결재{background:var(--도장)}

  table.셈{width:100%; border-collapse:collapse; font-size:14px; margin-top:8px}
  table.셈 td{padding:4px 0; border-bottom:1px solid var(--줄)}
  table.셈 td:last-child{text-align:right; font-weight:800}
  .도장자국{
    position:fixed; left:50%; top:44%; transform:translate(-50%,-50%) rotate(-14deg);
    border:5px solid var(--도장); color:var(--도장); font-size:44px; font-weight:900;
    padding:6px 22px; border-radius:8px; opacity:0; pointer-events:none; z-index:40;
    letter-spacing:6px;

  .도장자국.보임{animation:쾅 .55s ease-out}
  @keyframes 쾅{
    0%{opacity:0; transform:translate(-50%,-50%) rotate(-14deg) scale(2.2)}
    35%{opacity:1; transform:translate(-50%,-50%) rotate(-14deg) scale(.94)}
    100%{opacity:0; transform:translate(-50%,-50%) rotate(-14deg) scale(1)}
  }
  @media (max-height:560px){
    .큰{min-height:48px; font-size:17px}
    .공문{padding:12px}
    header{font-size:12px}
  }
</style>
</head>

/* ── 공문 한 장 만들기 ── */
function 공문만들기(오늘날, 켜진규칙){

    직위: 하나(직위), 전화: '0' + 정수(31,64) + '-' + 정수(200,999) + '-' + 정수(1000,9999),
    문서번호: 부서 + '-' + 정수(100, 3999),
    제목: g.제목,
    몸: g.몸.replace('{기한}', 기한).replace('{금액}', 금액)
             .replace('{부서}', 부서).replace('{담당}', 담당),
    붙임: g.붙임.slice(),
    발신일: 발신일, 시행일: 시행일,
    결재: [{이름:'담당', 값:담당}, {이름:'팀장', 값:사람()}, {이름:'과장', 값:사람()}],
    금액숫자: 금액숫자, 금액한글: 한글수,
    흠: []
  };

  // 켜진 규칙 가운데 골라 흠을 심는다 (절반쯤은 흠 없이 그대로 둔다)
  if (난수() < 0.55 && 켜진규칙.length){
    var 몇 = (난수() < 0.22 && 켜진규칙.length > 1) ? 2 : 1;
    var 섞 = 켜진규칙.slice();
    for (var i = 섞.length - 1; i > 0; i--){ var j = Math.floor(난수()*(i+1)); var t=섞[i]; 섞[i]=섞[j]; 섞[j]=t; }
    for (var k = 0; k < 몇; k++) 흠심기(문서, 섞[k].열쇠);
  }
  return 문서;
}

function 흠심기(문, 열쇠){
  if (문.흠.indexOf(열쇠) >= 0) return;
  문.흠.push(열쇠);
  if (열쇠 === '붙임') 문.붙임 = [];
  else if (열쇠 === '날짜') 문.시행일 = 더한날(문.발신일, -정수(1,4));
  else if (열쇠 === '결재선') 문.결재[정수(0,2)].값 = '';
  else if (열쇠 === '수신') 문.수신기관 = '';
  else if (열쇠 === '금액'){
    if (문.몸.indexOf('₩') < 0){ 문.흠.pop(); return; }   // 금액이 없는 공문이면 취소
    var 다른 = (문.금액숫자 === 1000000) ? 7000000 : 문.금액숫자 - 1000000;
    문.몸 = 문.몸.replace('₩' + 문.금액숫자.toLocaleString(), '₩' + 다른.toLocaleString());
  }
  else if (열쇠 === '담당'){ if (난수() < 0.5) 문.담당 = ''; else 문.전화 = ''; }
  else if (열쇠 === '문서번호') 문.문서번호 = 난수() < 0.5 ? 문.부서 + '-' : '-' + 정수(100,3999);
  else if (열쇠 === '기관') 문.수신기관 = 문.발신기관;
}

/* 이 공문을 반려해야 하는가 — 오늘 켜진 규칙만으로 판단 */
function 반려해야하나(문, 켜진규칙){
  var 걸린 = [];
  켜진규칙.forEach(function(r){
    if (문.흠.indexOf(r.열쇠) >= 0) 걸린.push(r);
  });
  return 걸린;
}

/* ── 놀이 상태 ── */
var 판 = {날:1, 처리:0, 경고:0, 돈:0, 오늘처리:0, 오늘틀림:0, 남은:0, 문서:null, 끝났나:false, 소리:false};
var 오늘날 = new Date(2026, 8, 29);
var 시계 = null;
var 하루초 = 60;

function 켜진규칙(){ return 규칙들.slice(0, Math.min(판.날 + 1, 규칙들.length)); }

/* ── 그리기 ── */
function 공문그리기(문){
  var 결재칸 = '<div class="결재칸">'

        return '<div><div class="머리">'+뺀글(c.이름)+'</div><div class="속">'
             + (c.값 ? 뺀글(c.값) : '<span style="color:#c0392b">(빈칸)</span>') + '</div></div>';
      }).join('')
    + '</div>';

  ㄱ('가운데').innerHTML =
    '<div class="공문">'
    + '<div class="기관">' + 뺀글(문.발신기관) + '</div>'
    + '<div class="줄선"></div>'
    + 결재칸
    + '<table>'
    + '<tr><th>문서번호</th><td>' + 뺀글(문.문서번호) + '</td></tr>'
    + '<tr><th>수신</th><td>' + (문.수신기관 ? 뺀글(문.수신기관) + ' 귀하' : '<span style="color:#c0392b">(없음)</span>') + '</td></tr>'
    + '<tr><th>발신일자</th><td>' + 날짜글(문.발신일) + '</td></tr>'
    + '<tr><th>시행일자</th><td>' + 날짜글(문.시행일) + '</td></tr>'
    + '</table>'
    + '<h2>' + 뺀글(문.제목) + '</h2>'
    + '<div class="몸">' + 뺀글(문.몸) + '</div>'
    + '<div class="붙임">붙임 &nbsp;'
    + (문.붙임.length
        ? 문.붙임.map(function(b,i){ return (i+1) + '. ' + 뺀글(b); }).join('<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;')
        : '<span style="color:#c0392b">(목록 없음)</span>')
    + '&nbsp; 끝.</div>'
    + '<div class="끝인사">위와 같이 시행하고자 하오니 재가하여 주시기 바랍니다.</div>'
    + '<div class="발신">' + 뺀글(문.발신기관) + '장</div>'
    + '<div class="꼬리">'
    + (문.담당 ? '담당 ' + 뺀글(문.부서) + ' ' + 뺀글(문.담당) + ' ' + 뺀글(문.직위)
              : '<span style="color:#c0392b">담당 (적히지 않음)</span>')
    + ' &nbsp;·&nbsp; '
    + (문.전화 ? '전화 ' + 뺀글(문.전화) : '<span style="color:#c0392b">전화 (적히지 않음)</span>')
    + '</div>'
    + '</div>';
  ㄱ('가운데').scrollTop = 0;
}

function 머리그리기(){
  ㄱ('날').textContent = 판.날 + '일차';
  ㄱ('처리').textContent = 판.처리;
  ㄱ('경고').textContent = 판.경고;
  ㄱ('돈').textContent = 판.돈.toLocaleString();
}

function 모래그리기(){
  var 몫 = Math.max(0, 판.남은) / 하루초;
  var i = ㄱ('모래');
  i.style.width = (몫 * 100) + '%';
  i.className = 몫 < 0.15 ? '끝남' : (몫 < 0.35 ? '급함' : '');
}

/* ── 소리 (파일 없이 만들어 낸다) ── */
var 소리통 = null;
function 삑(높이, 길이, 종류){
  if (!판.소리) return;
  try{
    if (!소리통) 소리통 = new (window.AudioContext || window.webkitAudioContext)();
    var o = 소리통.createOscillator(), g = 소리통.createGain();
    o.type = 종류 || 'triangle'; o.frequency.value = 높이;
    g.gain.setValueAtTime(0.06, 소리통.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, 소리통.currentTime + 길이);
    o.connect(g); g.connect(소리통.destination);
    o.start(); o.stop(소리통.currentTime + 길이);
  }catch(e){}
}

/* ── 한 장 판정 ── */
function 누름(결재했나){
  if (판.끝났나 || !판.문서) return;
  var 걸린 = 반려해야하나(판.문서, 켜진규칙());
  var 반려해야 = 걸린.length > 0;
  var 맞음 = (결재했나 && !반려해야) || (!결재했나 && 반려해야);

  var 자국 = ㄱ('도장');
  자국.textContent = 결재했나 ? '결재' : '반려';
  자국.className = '도장자국' + (결재했나 ? '' : ' 반려');
  void 자국.offsetWidth;
  자국.className += ' 보임';

  판.처리++; 판.오늘처리++;
  if (맞음){
    판.돈 += 500;
    삑(880, 0.12);
    알림('맞았습니다. ' + (반려해야 ? '(' + 걸린.map(function(r){return r.이름;}).join(' · ') + ')' : '흠 없는 공문이었습니다.'), true);
  } else {
    판.경고++; 판.오늘틀림++;
    삑(160, 0.25, 'sawtooth');
    알림(반려해야
      ? '틀렸습니다 — 이 공문은 반려했어야 합니다. ' + 걸린.map(function(r){return '「'+r.이름+'」';}).join(' ')
      : '틀렸습니다 — 흠이 없는 공문을 되돌렸습니다.', false);
  }
  머리그리기();

  if (판.경고 >= 3){ 끝내기('해고되었습니다'); return; }
  다음장();
}

function 알림(글, 좋나){
  ㄱ('알림칸').innerHTML = '<div class="알림 ' + (좋나 ? '맞음' : '틀림') + '">' + 뺀글(글) + '</div>';
}

function 다음장(){
  판.문서 = 공문만들기(오늘날, 켜진규칙());
  공문그리기(판.문서);
}

/* ── 하루 ── */
function 하루시작(){
  판.오늘처리 = 0; 판.오늘틀림 = 0; 판.남은 = 하루초;
  머리그리기(); 모래그리기();
  ㄱ('알림칸').innerHTML = '';
  다음장();
  if (시계) clearInterval(시계);
  시계 = setInterval(function(){
    판.남은 -= 0.25;
    모래그리기();
    if (판.남은 <= 0){ clearInterval(시계); 시계 = null; 하루마감(); }
  }, 250);
}

function 하루마감(){
  var 일당 = 판.오늘처리 * 500;
  var 벌금 = 판.오늘틀림 * 300;
  판.돈 -= 벌금;
  if (판.돈 < 0) 판.돈 = 0;
  머리그리기();
  var 다음규칙 = 규칙들[Math.min(판.날 + 1, 규칙들.length - 1)];
  var 새규칙있나 = (판.날 + 1) < 규칙들.length;
  쪽지(
    '<h2>' + 판.날 + '일차 끝</h2>'
    + '<table class="셈">'
    + '<tr><td>오늘 처리한 공문</td><td>' + 판.오늘처리 + '건</td></tr>'
    + '<tr><td>잘못 판단</td><td>' + 판.오늘틀림 + '건</td></tr>'
    + '<tr><td>일당 (건당 500원)</td><td>' + 일당.toLocaleString() + '원</td></tr>'
    + '<tr><td>감봉 (실수당 300원)</td><td>-' + 벌금.toLocaleString() + '원</td></tr>'
    + '<tr><td>지금까지</td><td>' + 판.돈.toLocaleString() + '원</td></tr>'
    + '</table>'
    + (새규칙있나
        ? '<h3>내일부터 규칙이 하나 늘어납니다</h3>'
          + '<div class="새규칙"><b>' + 뺀글(다음규칙.이름) + '</b><br>' + 뺀글(다음규칙.설명) + '</div>'
        : '<h3>규칙은 더 늘지 않습니다. 이제 속도 싸움입니다.</h3>')
    + '<button class="큰" id="다음날단추">' + (판.날 + 1) + '일차 시작</button>',
    function(){
      ㄱ('다음날단추').addEventListener('click', function(){
        덮개닫기(); 판.날++; 하루시작();
      });
    });
}

function 끝내기(까닭){
  판.끝났나 = true;
  if (시계){ clearInterval(시계); 시계 = null; }
  쪽지(
    '<h2>' + 뺀글(까닭) + '</h2>'
    + '<p>경고 세 번이면 책상을 비웁니다. 규칙이 늘어날수록 눈이 빨라야 합니다.</p>'
    + '<table class="셈">'
    + '<tr><td>버틴 날</td><td>' + 판.날 + '일</td></tr>'
    + '<tr><td>처리한 공문</td><td>' + 판.처리 + '건</td></tr>'
    + '<tr><td>받은 돈</td><td>' + 판.돈.toLocaleString() + '원</td></tr>'
    + '</table>'
    + '<h3>이 게임을 만든 곳</h3>'
    + '<p style="font-size:14px">밸류스는 공문을 «진짜로» 검사해 주는 프로그램도 만듭니다. '
    + '붙임 빠짐, 시행일자 뒤바뀜, 결재선 빈칸을 사람 대신 찾아 줍니다. '
    + '<b>valuestools.kr</b></p>'
    + '<button class="큰" id="다시단추">처음부터 다시</button>',
    function(){
      ㄱ('다시단추').addEventListener('click', function(){ 덮개닫기(); 처음부터(); });
    });
}

/* ── 쪽지 ── */
function 쪽지(속, 뒤에){
  ㄱ('쪽지').innerHTML = 속;
  ㄱ('덮개').classList.remove('가림');
  if (뒤에) 뒤에();
}
function 덮개닫기(){ ㄱ('덮개').classList.add('가림'); }

function 규칙보기(){
  var 켜 = 켜진규칙();
  쪽지(
    '<h2>오늘의 규칙</h2>'
    + '<p style="font-size:14px;color:#7b7466">아래 가운데 하나라도 걸리면 <b>반려</b>, '
    + '하나도 안 걸리면 <b>결재</b>입니다.</p>'
    + '<ul>' + 켜.map(function(r){
        return '<li><b>' + 뺀글(r.이름) + '</b><br><span style="color:#7b7466">' + 뺀글(r.설명) + '</span></li>';
      }).join('') + '</ul>'
    + '<button class="큰" id="닫기단추">닫고 이어 하기</button>',
    function(){ ㄱ('닫기단추').addEventListener('click', 덮개닫기); });
}

/* ── 시작 ── */
function 처음부터(){
  판 = {날:1, 처리:0, 경고:0, 돈:0, 오늘처리:0, 오늘틀림:0, 남은:0, 문서:null, 끝났나:false, 소리:판.소리};
  씨앗(Date.now() >>> 0);
  하루시작();
}

function 첫화면(){
  쪽지(
    '<h2>결재요망!</h2>'
    + '<p>당신은 오늘 처음 출근한 <b>결재 담당</b>입니다.</p>'
    + '<p>공문이 한 장씩 올라옵니다. 규칙에 걸리면 <b>반려</b>, 깨끗하면 <b>결재</b>.</p>'
    + '<ul>'
    + '<li>하루는 60초입니다. 많이 처리할수록 일당이 늡니다.</li>'
    + '<li>틀리면 경고 하나. <b>세 번이면 해고</b>입니다.</li>'
    + '<li>날마다 규칙이 하나씩 늘어납니다.</li>'
    + '</ul>'
    + '<h3>첫날 규칙</h3>'
    + '<div class="새규칙"><b>' + 뺀글(규칙들[0].이름) + '</b><br>' + 뺀글(규칙들[0].설명) + '<br><br>'
    + '<b>' + 뺀글(규칙들[1].이름) + '</b><br>' + 뺀글(규칙들[1].설명) + '</div>'
    + '<button class="큰" id="시작단추">출근하기</button>',
    function(){
      ㄱ('시작단추').addEventListener('click', function(){ 덮개닫기(); 처음부터(); });
    });
}

ㄱ('결재단추').addEventListener('click', function(){ 누름(true); });
ㄱ('반려단추').addEventListener('click', function(){ 누름(false); });
ㄱ('규칙단추').addEventListener('click', 규칙보기);
ㄱ('소리단추').addEventListener('click', function(){
  판.소리 = !판.소리;
  this.textContent = 판.소리 ? '소리 켬' : '소리 끔';
});
document.addEventListener('keydown', function(e){
  if (ㄱ('덮개').classList.contains('가림') === false) return;
  if (e.key === 'ArrowRight' || e.key === 'd') 누름(true);
  if (e.key === 'ArrowLeft' || e.key === 'a') 누름(false);
});

/* 시험할 때 밖에서 들여다볼 수 있게 열어 둔다 */
window.결재요망 = {
  판: function(){ return 판; },
  문서: function(){ return 판.문서; },
  규칙: 켜진규칙,
  반려해야하나: function(){ return 반려해야하나(판.문서, 켜진규칙()).length > 0; },
  씨앗: 씨앗,
  시계멈춤: function(){ if (시계){ clearInterval(시계); 시계 = null; } },
  하루마감: 하루마감
};

첫화면();
</script>
