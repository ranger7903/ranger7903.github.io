      if(!r.ok) throw new Error('part');
      return r.arrayBuffer();
    }).then(function(ab){
      if(ab.byteLength !== p.size) throw new Error('size');

    return crypto.subtle.digest('SHA-256', all).then(function(d){

      var a = document.createElement('a');
      a.href = url; a.download = info.saveAs;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
      btn.textContent = L.done; fill.style.width='100%';
    });

    btn.disabled = false; btn.textContent = L.again;
