<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --바탕:#f4f6f9; --판:#ffffff; --글:#1b2430; --흐린글:#6b7684;
  --테두리:#e3e7ec; --색:#26608E; --색연한:#eaf1f7; --노랑:#f0a02a;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --바탕:#11161d; --판:#1a222c; --글:#eef2f6; --흐린글:#9aa5b1;
  --테두리:#2a3440; --색:#68a8d8; --색연한:#1f2c38; --노랑:#f0b95a;
}}
:root[data-theme="dark"]{
  --바탕:#11161d; --판:#1a222c; --글:#eef2f6; --흐린글:#9aa5b1;
  --테두리:#2a3440; --색:#68a8d8; --색연한:#1f2c38; --노랑:#f0b95a;
}
html,body{margin:0;padding:0;height:100%}
body{background:var(--바탕);color:var(--글);
  font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  font-size:16px;line-height:1.5;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

/* ── 머리 ───────────────────────────────── */
#머리{position:fixed;top:0;left:0;right:0;z-index:20;background:var(--판);
  border-bottom:1px solid var(--테두리);padding:max(8px,env(safe-area-inset-top)) 10px 8px}
.줄{display:flex;align-items:center;gap:8px}
#말단추{flex:1;display:flex;align-items:center;justify-content:space-between;
  background:var(--색연한);border:1px solid var(--테두리);border-radius:12px;
  padding:10px 14px;font-weight:800;font-size:17px;min-height:46px}
#말단추 .작게{font-weight:600;font-size:13px;color:var(--흐린글)}
.둥근{width:46px;height:46px;border-radius:12px;border:1px solid var(--테두리);
  background:var(--판);display:flex;align-items:center;justify-content:center;font-size:20px}
/* 화면 말(한국어/English) 바꾸는 단추 — 글자가 들어가므로 너비를 글에 맞춘다 */
#화면말단추{width:auto;min-width:46px;padding:0 11px;font-size:13.5px;font-weight:800;
  white-space:nowrap;color:var(--색)}
#찾기{width:100%;margin-top:8px;padding:10px 12px;border-radius:12px;
  border:1px solid var(--테두리);background:var(--바탕);color:var(--글);font-size:15px}
#탭들{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:2px;
  scrollbar-width:none}
#탭들::-webkit-scrollbar{display:none}
.탭{white-space:nowrap;padding:8px 13px;border-radius:999px;border:1px solid var(--테두리);
  background:var(--판);font-size:14px;font-weight:700;color:var(--흐린글)}
.탭.켬{background:var(--색);border-color:var(--색);color:#fff}

/* ── 목록 ───────────────────────────────── */
#몸{position:absolute;top:0;left:0;right:0;bottom:0;overflow-y:auto;
  -webkit-overflow-scrolling:touch;padding:0 10px 28px}
.칸{background:var(--판);border:1px solid var(--테두리);border-radius:14px;
  padding:13px 14px;margin-bottom:9px;display:flex;gap:10px;align-items:flex-start}
.칸 .속{flex:1;min-width:0}
.칸 .우리말{font-size:13.5px;color:var(--흐린글);margin-bottom:3px}
.칸 .저쪽말{font-size:19px;font-weight:700;line-height:1.4;word-break:break-word}
.칸 .덧{font-size:13px;color:var(--흐린글);margin-top:4px}
.별{font-size:21px;color:var(--테두리);padding:2px 2px 0;line-height:1}
.별.켬{color:var(--노랑)}
.머리글{font-size:13px;font-weight:800;color:var(--흐린글);margin:14px 2px 7px}
.빔{text-align:center;color:var(--흐린글);padding:40px 20px;font-size:15px}

/* ── 크게 보여 주기 ─────────────────────── */
#크게{position:fixed;inset:0;z-index:40;background:var(--판);display:none;
  flex-direction:column;padding:max(10px,env(safe-area-inset-top)) 16px
  max(10px,env(safe-area-inset-bottom))}
#크게.켬{display:flex}
#크게 .위{display:flex;align-items:center;gap:8px}
#크게 .가운데{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;gap:18px;overflow-y:auto;padding:10px 0}
#큰글{font-size:34px;font-weight:800;line-height:1.35;word-break:break-word}
#큰우리말{font-size:17px;color:var(--흐린글);line-height:1.45}
#큰영어{font-size:16px;color:var(--흐린글)}
#크게 .아래{display:flex;gap:10px}
#크게 .아래 button{flex:1;padding:15px;border-radius:14px;border:1px solid var(--테두리);
  background:var(--바탕);font-weight:800;font-size:16px}

/* ── 말 고르기 ──────────────────────────── */
#말판{position:fixed;inset:0;z-index:50;background:var(--바탕);display:none;
  flex-direction:column;padding:max(10px,env(safe-area-inset-top)) 12px 12px}
#말판.켬{display:flex}
#말목록{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(2,1fr);
  gap:8px;align-content:start;padding-bottom:16px}
@media(min-width:520px){#말목록{grid-template-columns:repeat(3,1fr)}}
.말칸{background:var(--판);border:1px solid var(--테두리);border-radius:12px;
  padding:11px 12px;text-align:left}
.말칸.켬{border-color:var(--색);background:var(--색연한)}
.말칸 b{display:block;font-size:16px}
.말칸 span{font-size:12.5px;color:var(--흐린글)}

/* ── 숫자판 ─────────────────────────────── */
#숫자판{position:fixed;inset:0;z-index:45;background:var(--판);display:none;
  flex-direction:column;padding:max(10px,env(safe-area-inset-top)) 14px 14px}
#숫자판.켬{display:flex}
#숫자값{flex:1;display:flex;align-items:center;justify-content:center;
  font-size:52px;font-weight:800;word-break:break-all;text-align:center}
#숫자키{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
#숫자키 button{padding:17px;border-radius:14px;border:1px solid var(--테두리);
  background:var(--바탕);font-size:23px;font-weight:800}
</style>
</head>

<div id="머리">
  <div class="줄">
    <button id="말단추" aria-label="손님 말 고르기">
      <span id="말이름">English</span><span class="작게" id="말우리이름">영어 ▾</span>
    </button>
    <button class="둥근" id="숫자단추" title="숫자 보여 주기">123</button>
    <button class="둥근" id="밤낮단추" title="밝게/어둡게">◐</button>
    <button class="둥근" id="화면말단추" title="한국어 / English">English</button>
  </div>
  <input id="찾기" type="search" placeholder="찾기 — 우리말로 치세요 (예: 서명)" autocomplete="off">
  <div id="탭들"></div>
</div>

<div id="몸"><div id="목록"></div></div>

<div id="크게">
  <div class="위">
    <button class="둥근" id="닫기" title="닫기">✕</button>
    <div style="flex:1;text-align:center;color:var(--흐린글);font-size:14px" id="큰자리표"></div>
    <button class="둥근" id="큰별">☆</button>
  </div>
  <div class="가운데">
    <div id="큰글"></div>
    <div id="큰우리말"></div>
    <div id="큰영어"></div>
  </div>
  <div class="아래">
    <button id="앞으로">◀ 앞</button>
    <button id="뒤로">뒤 ▶</button>
  </div>
</div>

<div id="말판">
  <div class="줄" style="margin-bottom:10px">
    <b style="flex:1;font-size:18px" id="말판제목">손님 말 고르기</b>
    <button class="둥근" id="말판닫기" title="닫기">✕</button>
  </div>
  <div id="말목록"></div>
</div>

<div id="숫자판">
  <div class="줄" style="margin-bottom:6px">
    <b style="flex:1;font-size:17px" id="숫자판제목">숫자 보여 주기</b>
    <button class="둥근" id="숫자닫기" title="닫기">✕</button>
  </div>
  <div id="숫자값">0</div>
  <div id="숫자키"></div>
</div>

<script>

var 자료 = JSON.parse(document.getElementById('말모음').textContent);

/* ── 기억해 두기 (안 되는 폰에서도 앱은 돌아가야 한다) ── */
function 읽기(열쇠, 기본){
  try{ var v = localStorage.getItem('손말_'+열쇠); return v===null?기본:JSON.parse(v); }
  catch(e){ return 기본; }
}
function 쓰기(열쇠, 값){

}

/* ═══════════════════════════════════════════════════════════════════════

var 말글 = {

  말고르기:'손님 말 고르기',
  숫자보기:'숫자 보여 주기',
  밝기:'밝게/어둡게',
  닫기:'닫기',
  화면말바꾸기:'한국어 / English',

  말이름:{}                   /* 비우면 자료에 적힌 우리이름 그대로 */

  찾기안내:'Search — type in English (e.g. sign)',

 }

/* 폰이 쓰는 말을 보고 처음 한 번만 고른다 (한국어면 한국어, 그 밖에는 영어). */
function 폰의말(){
  try{
    var 들 = (navigator.languages && navigator.languages.length)
             ? navigator.languages : [navigator.language || ''];
    for(var i=0;i<들.length;i++){
      if(String(들[i]||'').toLowerCase().indexOf('ko')===0) return 'ko';
    }
  }catch(e){}
  return 'en';
}
var 화면말 = 읽기('화면말', null);
if(화면말!=='ko' && 화면말!=='en') 화면말 = 폰의말();

/* 껍데기 글 한 마디 꺼내기. 없으면 한국어 원문으로 되돌아간다 (안전한 되돌림). */
function ㄱ(열쇠){
  var 방 = 말글[화면말] || 말글.ko;
  var v = 방[열쇠];
  return (v===undefined || v===null || v==='') ? (말글.ko[열쇠]===undefined?열쇠:말글.ko[열쇠]) : v;
}
/* 묶음(탭) 이름과 말 이름표 — 영어판에 없으면 자료에 적힌 한국어 그대로 */
function 묶음이름(묶){ return (ㄱ('묶음')||{})[묶.열쇠] || 묶.이름; }
function 말이름표(m){ return (ㄱ('말이름')||{})[m.코드] || m.우리이름; }

var 지금말 = 읽기('말','en');
if(!자료.말들.some(function(m){return m.코드===지금말;})) 지금말='en';
var 지금탭 = 읽기('탭', 자료.묶음들[0].열쇠);
var 즐겨 = 읽기('즐겨', []);
var 테마 = 읽기('테마', null);
if(테마) document.documentElement.setAttribute('data-theme', 테마);

/* ── 문장을 한 줄로 다룬다 ── */
var 줄들 = [];
자료.직원말.forEach(function(p,i){
  줄들.push({id:'ㅈ'+i, 묶음:p.묶음, ko:p.ko, 글:p, 누구:'직원'});
});
자료.손님말.forEach(function(p,i){
  줄들.push({id:'ㅅ'+i, 묶음:'손님', ko:p.ko, 글:p, 누구:'손님'});
});

function 저쪽말(줄){ return 줄.글[지금말] || ''; }
/* 「이 문장이 미덥지 않은가」 — 구울 때 이미 가려내 두었다.
   (말마다·문장마다 바탕이 달라서, 두 쪽 다 낮을 때만 표시한다) */
function 미덥지않나(줄){
  if(지금말==='en') return false;
  var 목 = 줄.글.약함;
  return !!(목 && 목.indexOf(지금말) >= 0);
}

/* ── 머리: 말 이름 ── */
function 말이름그리기(){
  var m = 자료.말들.filter(function(x){return x.코드===지금말;})[0];
  document.getElementById('말이름').textContent = m.제이름;
  document.getElementById('말우리이름').textContent = 말이름표(m) + ' ▾';
}

/* ── 화면 껍데기를 지금 화면말로 다시 써 넣기 ── */
function 글놓기(id, 글){ var e = document.getElementById(id); if(e) e.textContent = 글; }
function 속성놓기(id, 이름, 글){ var e = document.getElementById(id); if(e) e.setAttribute(이름, 글); }
function 껍데기그리기(){
  document.documentElement.setAttribute('lang', 화면말);
  document.title = ㄱ('앱이름');
  var 설명 = document.querySelector('meta[name="description"]');
  if(설명) 설명.setAttribute('content', ㄱ('앱설명'));
  글놓기('말판제목', ㄱ('말고르기'));
  글놓기('숫자판제목', ㄱ('숫자보기'));
  글놓기('앞으로', ㄱ('앞'));
  글놓기('뒤로', ㄱ('뒤'));
  속성놓기('말단추', 'aria-label', ㄱ('말고르기'));
  속성놓기('숫자단추', 'title', ㄱ('숫자보기'));
  속성놓기('밤낮단추', 'title', ㄱ('밝기'));
  속성놓기('찾기', 'placeholder', ㄱ('찾기안내'));
  ['닫기','말판닫기','숫자닫기'].forEach(function(id){
    속성놓기(id, 'title', ㄱ('닫기'));
    속성놓기(id, 'aria-label', ㄱ('닫기'));
  });
  var 바꿈 = document.getElementById('화면말단추');
  if(바꿈){
    바꿈.textContent = ㄱ('건너편');
    바꿈.setAttribute('title', ㄱ('화면말바꾸기'));
    바꿈.setAttribute('aria-label', ㄱ('화면말바꾸기'));
  }
  숫자키그리기();
}

/* [English]/[한국어] 를 누르면 화면 껍데기만 갈아 끼운다.
   손님에게 보여 주는 문장·담긴 말 서른여섯 가지는 그대로다. */
function 화면말바꾸기(){
  화면말 = (화면말==='ko') ? 'en' : 'ko';
  쓰기('화면말', 화면말);
  껍데기그리기(); 말이름그리기(); 탭그리기(); 목록그리기(); 큰그리기(); 자리맞추기();
}

/* ── 탭 ── */
function 탭그리기(){
  var 통 = document.getElementById('탭들');
  통.innerHTML = '';
  var 목 = [{열쇠:'즐겨', 이름:ㄱ('즐겨찾기'), 그림:'⭐'}]
      .concat(자료.묶음들)
      .concat([{열쇠:'손님', 이름:ㄱ('손님답'), 그림:'🙋'}]);
  목.forEach(function(t){
    var b = document.createElement('button');
    b.className = '탭' + (t.열쇠===지금탭 ? ' 켬' : '');
    b.textContent = t.그림 + ' ' + 묶음이름(t);
    b.onclick = function(){ 지금탭=t.열쇠; 쓰기('탭',지금탭); 탭그리기(); 목록그리기(); };
    통.appendChild(b);
  });
  자리맞추기();
}

/* 머리 높이가 바뀌므로 목록 시작 위치를 맞춰 준다 */
function 자리맞추기(){
  var h = document.getElementById('머리').offsetHeight;
  document.getElementById('몸').style.top = h + 'px';
}

/* ── 목록 ── */
function 보일줄들(){
  var 찾는말 = document.getElementById('찾기').value.trim();
  if(찾는말){
    var ㄴ = 찾는말.toLowerCase();
    return 줄들.filter(function(r){
      return r.ko.toLowerCase().indexOf(ㄴ)>=0 ||
             (저쪽말(r)||'').toLowerCase().indexOf(ㄴ)>=0 ||
             /* 영어 화면에서는 영어로도 찾을 수 있어야 한다.
                (담긴 문장을 바꾸는 것이 아니라, 찾는 자리만 넓히는 것) */
             (화면말==='en' && (r.글.en||'').toLowerCase().indexOf(ㄴ)>=0);
    });
  }
  if(지금탭==='즐겨') return 줄들.filter(function(r){return 즐겨.indexOf(r.id)>=0;});
  return 줄들.filter(function(r){return r.묶음===지금탭;});
}

function 목록그리기(){
  var 통 = document.getElementById('목록');
  통.innerHTML = '';
  var 보임 = 보일줄들();
  if(!보임.length){
    var 빔 = document.createElement('div');
    빔.className='빔';
    빔.textContent = (지금탭==='즐겨') ? ㄱ('즐겨빔') : ㄱ('못찾음');
    통.appendChild(빔); return;
  }
  if(지금탭==='손님' && !document.getElementById('찾기').value.trim()){
    var ㅁ = document.createElement('div');
    ㅁ.className='머리글';
    ㅁ.textContent = ㄱ('건네주기');
    통.appendChild(ㅁ);
  }
  보임.forEach(function(r){
    var 칸 = document.createElement('div');
    칸.className = '칸';
    var 속 = document.createElement('div');
    속.className='속';
    var a = document.createElement('div'); a.className='우리말'; a.textContent = r.ko;
    var b = document.createElement('div'); b.className='저쪽말'; b.textContent = 저쪽말(r) || ㄱ('없음');
    속.appendChild(r.누구==='손님' ? b : a);
    속.appendChild(r.누구==='손님' ? a : b);
    if(미덥지않나(r)){
      var c = document.createElement('div'); c.className='덧';
      c.textContent = ㄱ('영어딱지') + (r.글.en||'');
      속.appendChild(c);
    }
    속.onclick = function(){ 크게보이기(보임, 보임.indexOf(r)); };
    var 별 = document.createElement('button');
    별.className = '별' + (즐겨.indexOf(r.id)>=0 ? ' 켬' : '');
    별.textContent = 즐겨.indexOf(r.id)>=0 ? '★' : '☆';
    별.onclick = function(e){ e.stopPropagation(); 별누름(r.id); 목록그리기(); };
    칸.appendChild(속); 칸.appendChild(별);
    통.appendChild(칸);
  });
}

function 별누름(id){
  var i = 즐겨.indexOf(id);
  if(i>=0) 즐겨.splice(i,1); else 즐겨.push(id);
  쓰기('즐겨', 즐겨);
}

/* ── 크게 보여 주기 ── */
var 큰목록 = [], 큰자리 = 0;
function 크게보이기(목, 자리){
  큰목록 = 목; 큰자리 = 자리;
  큰그리기();
  document.getElementById('크게').classList.add('켬');
}
function 큰그리기(){
  var r = 큰목록[큰자리];
  if(!r) return;
  /* 손님이 누른 대답은 **직원이 읽어야** 하므로 우리말을 크게,
     직원이 보여 주는 말은 **손님이 읽어야** 하므로 저쪽 말을 크게. */
  if(r.누구==='손님'){
    document.getElementById('큰글').textContent = r.ko;
    document.getElementById('큰우리말').textContent = 저쪽말(r) || '';
  }else{
    document.getElementById('큰글').textContent = 저쪽말(r) || r.ko;
    document.getElementById('큰우리말').textContent = r.ko;
  }
  document.getElementById('큰자리표').textContent =
    (큰목록.length>1) ? ((큰자리+1) + ' / ' + 큰목록.length) : '';
  var 영 = document.getElementById('큰영어');
  영.textContent = 미덥지않나(r) ? (ㄱ('영어딱지') + (r.글.en||'')) : '';
  var 별 = document.getElementById('큰별');
  var 켬 = 즐겨.indexOf(r.id)>=0;
  별.textContent = 켬 ? '★' : '☆';
  별.style.color = 켬 ? 'var(--노랑)' : '';
}
document.getElementById('닫기').onclick = function(){
  document.getElementById('크게').classList.remove('켬'); 목록그리기();
};
document.getElementById('앞으로').onclick = function(){
  if(큰자리>0){ 큰자리--; 큰그리기(); }
};
document.getElementById('뒤로').onclick = function(){
  if(큰자리<큰목록.length-1){ 큰자리++; 큰그리기(); }
};
document.getElementById('큰별').onclick = function(){
  별누름(큰목록[큰자리].id); 큰그리기();
};

/* ── 말 고르기 ── */
function 말판그리기(){
  var 통 = document.getElementById('말목록');
  통.innerHTML='';
  자료.말들.forEach(function(m){
    var b = document.createElement('button');
    b.className='말칸' + (m.코드===지금말?' 켬':'');
    var n = document.createElement('b'); n.textContent = m.제이름;
    var k = document.createElement('span'); k.textContent = 말이름표(m);
    b.appendChild(n); b.appendChild(k);
    b.onclick = function(){
      지금말 = m.코드; 쓰기('말', 지금말);
      document.getElementById('말판').classList.remove('켬');
      말이름그리기(); 목록그리기(); 큰그리기();
    };
    통.appendChild(b);
  });
}
document.getElementById('말단추').onclick = function(){
  말판그리기(); document.getElementById('말판').classList.add('켬');
};
document.getElementById('말판닫기').onclick = function(){
  document.getElementById('말판').classList.remove('켬');
};

/* ── 숫자 보여 주기 ── */
var 숫자글 = '';
function 숫자그리기(){
  document.getElementById('숫자값').textContent =
    숫자글 ? 숫자글.replace(/\B(?=(\d{3})+(?!\d))/g, ',') : '0';
}
function 숫자키그리기(){
  var 통 = document.getElementById('숫자키');
  if(!통) return;
  통.innerHTML = '';
  ['1','2','3','4','5','6','7','8','9','←','0','지움'].forEach(function(k){
    var b=document.createElement('button');
    b.textContent = (k==='지움') ? ㄱ('지움') : k;
    b.onclick=function(){
      if(k==='←') 숫자글 = 숫자글.slice(0,-1);
      else if(k==='지움') 숫자글='';
      else if(숫자글.length<12) 숫자글 += k;
      숫자그리기();
    };
    통.appendChild(b);
  });
}
document.getElementById('숫자단추').onclick = function(){
  숫자그리기(); document.getElementById('숫자판').classList.add('켬');
};
document.getElementById('숫자닫기').onclick = function(){
  document.getElementById('숫자판').classList.remove('켬');
};

/* ── 밝게/어둡게 ── */
document.getElementById('밤낮단추').onclick = function(){
  var 지금 = document.documentElement.getAttribute('data-theme');
  var 다음 = (지금==='dark') ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', 다음);
  쓰기('테마', 다음);
};

document.getElementById('화면말단추').onclick = 화면말바꾸기;
document.getElementById('찾기').addEventListener('input', 목록그리기);
window.addEventListener('resize', 자리맞추기);

껍데기그리기(); 말이름그리기(); 탭그리기(); 목록그리기(); 자리맞추기();


})();
</script>
</body>
</html>
