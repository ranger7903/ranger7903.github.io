<!DOCTYPE html>
<html lang="ko">

<meta charset="utf-8">

<title>오늘의 속담</title>

<link rel="manifest" href="sokdam_manifest.json">

<style>
:root{--cream:#FAF5EC;--card:#FFFDF8;--line:#E4D9C6;--ink:#41382E;--ink2:#6E6355;--ink3:#9A8F7F;
 --terra:#C0684A;--terra-soft:#F6E3DA;--sage:#7E9B77}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--cream);color:var(--ink);
 font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
 font-size:16px;line-height:1.75;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
header{background:var(--sage);color:#F4F8F1;padding:calc(14px + env(safe-area-inset-top)) 18px 12px;
 display:flex;align-items:center;gap:8px}
header b{font-size:18px}
header .stat{margin-left:auto;font-size:11.5px;color:#E2EDDD;text-align:right;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;
 margin-bottom:14px;box-shadow:0 10px 30px -24px rgba(80,60,30,.6)}
.day{color:var(--terra);font-weight:700;font-size:13px;text-align:center}
.quote{font-family:"Gowun Batang",serif;font-size:21px;text-align:center;margin:14px 0;word-break:keep-all}
.quote .blank{color:var(--terra);letter-spacing:2px}
.hint{font-size:13px;color:var(--ink2);margin:12px 0 6px;text-align:center;min-height:20px}
input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;text-align:center;
 font-family:inherit;font-size:17px;background:#fff;color:var(--ink)}
.btn{display:block;width:100%;border:none;background:var(--sage);color:#F4F8F1;
 font-family:inherit;font-size:16px;font-weight:700;border-radius:12px;padding:13px;margin-top:12px}
.btn.line{background:none;border:1.5px solid var(--line);color:var(--ink2);font-weight:400;font-size:14px}
.msg{text-align:center;font-size:14px;min-height:22px;margin-top:10px;color:var(--ink2)}
.msg.win{color:var(--sage);font-weight:700}
.mean{background:#F3F7F1;border-radius:12px;padding:13px;font-size:14px;color:var(--ink2);
 margin-top:12px;display:none}
.mean b{color:var(--sage)}
.tries{text-align:center;font-size:18px;letter-spacing:6px;margin-top:6px;min-height:24px}
.entry{border-bottom:1px dashed var(--line);padding:9px 2px;font-size:13.5px}
.entry:last-child{border-bottom:none}
.entry .m{font-size:11px;color:var(--ink3)}
.foot{text-align:center;font-size:11.5px;color:var(--ink3);margin:18px 0}
.foot a{color:var(--terra);text-decoration:none}
.gift{text-align:center;font-size:12.5px;color:var(--ink3);margin-top:2px}
</style>
</head>
<body>
<header>🧶 <b id="appname">오늘의 속담</b>
 <button id="langbtn" onclick="toggleLang()" style="margin-left:8px;border:none;background:#5d7a58;color:#fff;border-radius:8px;padding:4px 10px;font-family:inherit;font-size:11px;font-weight:700">EN</button>
 <span class="stat" id="stat"></span></header>
<div class="wrap">
 <div class="card">
  <p class="day" id="day"></p>
  <p class="quote" id="quote"></p>

  <input id="guess" placeholder="여기에 답을 적어보세요" autocomplete="off">
  <button class="btn" id="checkbtn" onclick="check()">🧶 맞혀보기</button>
  <p class="msg" id="msg"></p>
  <div class="mean" id="mean"></div>
  <button class="btn line" id="sharebtn" style="display:none" onclick="share()">📋 오늘 결과 복사하기</button>
 </div>

 <div class="card">
  <p style="margin:0 0 6px;font-size:13px;color:var(--ink2)" id="h-arch">📖 지난 속담들</p>
  <div id="archive"><p style="font-size:13px;color:var(--ink3)" id="arch-empty">내일부터 여기에 하나씩 쌓여요.</p></div>
 </div>

 <p class="foot" id="foot1">광고 없이, 하루 한 알 — 전부 이 폰 안에서만 동작해요<br>
  <a href="https://valuestools.kr">밸류스 — 작은 도구 상점</a>이 드리는 선물이에요</p>
</div>

const LX = {
 ko: { app:'오늘의 속담', day:n=>n+'번째 속담', hint0:'빈칸(○)에 들어갈 말은 무엇일까요?',
   guess_ph:'여기에 답을 적어보세요', check:'🧶 맞혀보기', share:'📋 오늘 결과 복사하기',
   arch:'📖 지난 속담들', arch_empty:'내일부터 여기에 하나씩 쌓여요.',
   foot:'광고 없이, 하루 한 알 — 전부 이 폰 안에서만 동작해요<br>\n  <a href="https://valuestools.kr">밸류스 — 작은 도구 상점</a>이 드리는 선물이에요',
   stat:(s,n)=>'연속 '+s+'일<br>맞힌 속담 '+n+'개',
   mean:m=>'<b>뜻</b> — '+m, win:'정답이에요! 내일 또 한 알 준비해 둘게요 🧡',
   lose:w=>'오늘 답은 「'+w+'」였어요. 내일 다시 만나요 :)',
   hint1:a=>'첫 글자는 「'+a+'」 이에요', hint2:m=>'뜻 힌트 — '+m,
   wrong:'음… 조금 달라요. 다시 한번!', got:(w,t)=>w?'맞힘 ('+t+'번 만에)':'아쉬움',
   share_win:t=>t+'번 만에 맞혔어요! ', share_lose:'오늘은 아쉬웠어요 ',
   copied:'복사했어요! 친구에게 붙여넣어 보내보세요' },
 en: { app:'Korean Proverb a Day', day:n=>'Proverb #'+n, hint0:'What word fills the blank (○)? (answer in Korean)',
   guess_ph:'Type your answer in Korean', check:'🧶 Guess', share:'📋 Copy my result',
   arch:'📖 Past proverbs', arch_empty:'They will pile up here from tomorrow.',
   foot:'No ads, one proverb a day — everything runs on this phone<br>\n  a gift from <a href="https://valuestools.kr/en.html">VALUES — a little tool shop</a>',
   stat:(s,n)=>s+'-day streak<br>'+n+' solved',
   mean:(m,me)=>'<b>Meaning</b> — '+(me||m)+'<br><span style="color:var(--ink3);font-size:12px">'+m+'</span>',
   win:'Correct! A new one will be ready tomorrow 🧡',
   lose:w=>'Today\'s answer was “'+w+'”. See you tomorrow :)',
   hint1:a=>'The first letter is “'+a+'”', hint2:(m,me)=>'Meaning hint — '+(me||m),
   wrong:'Hmm… not quite. Try again!', got:(w,t)=>w?'solved (in '+t+')':'missed',
   share_win:t=>'Solved in '+t+'! ', share_lose:'Missed today ',
   copied:'Copied! Paste it to a friend' },
};
let lang = null;
try{ lang = localStorage.getItem('values_lang'); }catch(e){}
if(!lang) lang = (navigator.language||'').toLowerCase().startsWith('ko') ? 'ko' : 'en';
function TT(){ return LX[lang]; }
function toggleLang(){ lang = lang==='ko' ? 'en' : 'ko';
  try{ localStorage.setItem('values_lang', lang); }catch(e){}
  retextStatic(); refresh(); }
function retextStatic(){
  const T = TT();
  document.getElementById('appname').textContent = T.app;
  document.getElementById('langbtn').textContent = lang==='ko' ? 'EN' : '한국어';
  if(!state.done) document.getElementById('hintline').textContent = T.hint0;
  document.getElementById('guess').placeholder = T.guess_ph;
  document.getElementById('checkbtn').textContent = T.check;
  document.getElementById('sharebtn').textContent = T.share;
  document.getElementById('h-arch').textContent = T.arch;
  const ae = document.getElementById('arch-empty');
  if(ae) ae.textContent = T.arch_empty;
  document.getElementById('foot1').innerHTML = T.foot;
  document.title = T.app;
}

const EPOCH = new Date('2026-01-01T00:00:00');

function store(k, v){ try{ if(v===undefined) return JSON.parse(localStorage.getItem(k)||'null');
  localStorage.setItem(k, JSON.stringify(v)); }catch(e){ return null; } }

function todayStr(){ const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function dayNo(){ const now = new Date(todayStr()+'T00:00:00');
  return Math.max(0, Math.round((now - EPOCH)/86400000)); }

const Q = BANK[dayNo() % BANK.length];
let state = store('sokdam_'+todayStr()) || { tries: 0, done: false, win: false };
let hist = store('sokdam_hist') || [];

function masked(){
  const blank = '○'.repeat(Q.w.replace(/\s/g,'').length);
  return Q.t.replace(Q.w, '<span class="blank">'+blank+'</span>');
}

function streak(){
  const days=[...new Set(hist.filter(h=>h.win).map(h=>h.date))].sort().reverse();
  let s=0; let d=new Date(todayStr()+'T00:00:00');
  for(const day of days){
    const ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if(day===ds){ s++; d.setDate(d.getDate()-1); } else break;
  }
  return s;
}

function refresh(){
  document.getElementById('day').textContent = TT().day(dayNo()%BANK.length+1);
  document.getElementById('quote').innerHTML = state.done ? '“'+Q.t+'”' : '“'+masked()+'”';
  document.getElementById('tries').textContent = '🧶'.repeat(Math.max(0,3-state.tries)) + '〰'.repeat(state.tries);
  document.getElementById('stat').innerHTML = TT().stat(streak(), hist.filter(h=>h.win).length);
  if(state.done){
    document.getElementById('guess').style.display='none';
    document.getElementById('checkbtn').style.display='none';
    document.getElementById('hintline').textContent = '';
    const mean = document.getElementById('mean');
    mean.style.display='block';
    mean.innerHTML = lang==='ko' ? TT().mean(Q.m) : TT().mean(Q.m, Q.me);
    document.getElementById('msg').className = 'msg' + (state.win?' win':'');
    document.getElementById('msg').textContent = state.win ? TT().win : TT().lose(Q.w);
    document.getElementById('sharebtn').style.display='block';
  }
  const arch = document.getElementById('archive');
  const past = hist.slice().reverse().slice(0,30);
  if(past.length){
    arch.innerHTML='';
    for(const h of past){
      const d=document.createElement('div'); d.className='entry';
      d.innerHTML = '<div class="m">'+h.date+' · '+TT().got(h.win, h.tries)+'</div>“'+h.t+'”';
      arch.appendChild(d);
    }
  }
}

function finish(win){
  state.done = true; state.win = win;
  store('sokdam_'+todayStr(), state);
  if(!hist.some(h=>h.date===todayStr())){
    hist.push({date: todayStr(), t: Q.t, win, tries: state.tries});
    store('sokdam_hist', hist);
  }
  refresh();
}

function check(){
  if(state.done) return;
  const g = document.getElementById('guess').value.trim().replace(/\s/g,'');
  if(!g) return;
  const ans = Q.w.replace(/\s/g,'');
  if(g === ans){ state.tries++; finish(true); return; }
  state.tries++;
  store('sokdam_'+todayStr(), state);
  if(state.tries >= 3){ finish(false); return; }
  document.getElementById('guess').value='';
  const hint = state.tries === 1 ? TT().hint1(ans[0]) : (lang==='ko' ? TT().hint2(Q.m) : TT().hint2(Q.m, Q.me));
  refresh();
  document.getElementById('hintline').textContent = hint;
  document.getElementById('msg').textContent = TT().wrong;
}

function share(){
  const txt = TT().app+' '+TT().day(dayNo()%BANK.length+1)+' — '
    + (state.win ? TT().share_win(state.tries) : TT().share_lose)
    + '🧶'.repeat(Math.max(0,3-state.tries)) + '〰'.repeat(state.tries)
    + '\n“'+ (state.win? Q.t : masked().replace(/<[^>]+>/g,'')) +'”'
    + '\nhttps://valuestools.kr/sokdam.html';
  if(navigator.share){ navigator.share({text: txt}).catch(()=>{}); }
  else { navigator.clipboard.writeText(txt).then(()=>{
    document.getElementById('msg').textContent=TT().copied; }); }
}

document.getElementById('guess').addEventListener('keydown', e=>{ if(e.key==='Enter') check(); });
retextStatic();
refresh();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sokdam_sw.js');
</script>
