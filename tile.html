<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>타일 서바이브 — 밸류스</title>
<meta name="description" content="안개를 걷고, 자원을 캐고, 전기를 대어 송신탑을 세우는 작은 생존 게임. 한 판 5분.">
<style>
:root{
  --bg:#12161A; --panel:#1B2127; --line:#2C343C; --ink:#E8E3DC; --dim:#93A0AC;
  --food:#7FB069; --wood:#C08C55; --power:#E7C14B; --scrap:#8E9AA6;
  --hot:#C0623A; --ok:#4E8C6A; --hidden:#232A31; --sel:#E7C14B;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);
  font-family:"Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  display:flex;flex-direction:column;overflow:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex:0 0 auto}
h1{font-size:15px;margin:0;letter-spacing:-.3px;white-space:nowrap}
.sub{font-size:11px;color:var(--dim);margin-left:2px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
@media(max-width:430px){ .sub{display:none} }
.spacer{flex:1}
/* 🚨 사진을 찍어 보고 잡은 흠 : 「한국어」가 두 줄로 갈라졌다. 단추 글은 안 접는다. */
button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);
  border-radius:9px;padding:7px 12px;cursor:pointer;white-space:nowrap}
#lang{min-width:66px;text-align:center}
button:hover:not(:disabled){border-color:#3E4954}
button:disabled{opacity:.42;cursor:default}
.res{display:flex;gap:6px;padding:8px 14px;border-bottom:1px solid var(--line);flex:0 0 auto;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);
  border-radius:9px;padding:6px 10px;font-size:13px;font-variant-numeric:tabular-nums}
.chip b{font-weight:600}
.chip .rate{font-size:11px;color:var(--dim)}
.dot{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:10px;min-height:0}
#board{display:grid;gap:3px;touch-action:manipulation}
.t{border-radius:6px;border:1px solid var(--line);background:var(--hidden);
  display:flex;align-items:center;justify-content:center;font-size:17px;cursor:default;
  transition:transform .08s,background .12s;position:relative;user-select:none}
.t.open{background:#222A31;border-color:#333D46}
.t.can{cursor:pointer;border-color:#4A5661;box-shadow:inset 0 0 0 1px #3A4550}
.t.can:active{transform:scale(.94)}
.t.sel{border-color:var(--sel);box-shadow:0 0 0 2px rgba(231,193,75,.35)}
.t.off{opacity:.45;filter:grayscale(1)}
    .t.blocked{background:#1A1E22;color:#4A545E}
.t .lv{position:absolute;right:2px;bottom:1px;font-size:9px;color:var(--dim)}
footer{flex:0 0 auto;border-top:1px solid var(--line);padding:10px 14px;min-height:96px}
.msg{font-size:13px;color:var(--dim);min-height:18px;margin-bottom:8px;line-height:1.45}
.row{display:flex;gap:7px;flex-wrap:wrap}
.b{display:flex;flex-direction:column;gap:2px;align-items:flex-start;padding:7px 11px;font-size:12px}
.b small{color:var(--dim);font-size:10.5px}
.over{position:fixed;inset:0;background:rgba(10,13,16,.9);display:none;
  align-items:center;justify-content:center;padding:22px;z-index:9}
.over.on{display:flex}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px 24px;
  max-width:380px;width:100%}
.card h2{margin:0 0 8px;font-size:19px}
.card p{margin:6px 0;font-size:13.5px;color:var(--dim);line-height:1.6}
.card .big{font-size:30px;color:var(--ink);margin:12px 0 4px;font-variant-numeric:tabular-nums}
.card button{width:100%;margin-top:14px;padding:11px;background:var(--hot);border-color:var(--hot)}
kbd{background:#252D35;border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:11px}
</style></head>
<body>

<header>
  <h1 id="ttl">타일 서바이브</h1><span class="sub" id="sub">한 판 5분</span>
  <span class="spacer"></span>
  <button id="lang">EN</button>
  <button id="again">다시</button>
</header>

<div class="res">
  <div class="chip"><span class="dot" style="background:var(--food)"></span>
    <span id="l1">식량</span> <b id="food">0</b> <span class="rate" id="rfood"></span></div>
  <div class="chip"><span class="dot" style="background:var(--wood)"></span>
    <span id="l2">목재</span> <b id="wood">0</b> <span class="rate" id="rwood"></span></div>
  <div class="chip"><span class="dot" style="background:var(--power)"></span>
    <span id="l3">전력</span> <b id="power">0</b> <span class="rate" id="rpower"></span></div>
  <div class="chip"><span class="dot" style="background:var(--scrap)"></span>
    <span id="l4">고철</span> <b id="scrap">0</b> <span class="rate" id="rscrap"></span></div>
  <div class="chip"><span id="l5">날</span> <b id="day">1</b></div>
</div>

<main><div id="board"></div></main>

<footer>
  <div class="msg" id="msg"></div>
  <div class="row" id="acts"></div>
</footer>

<div class="over" id="over"><div class="card">
  <h2 id="ovt"></h2><div class="big" id="ovs"></div><p id="ovp"></p>
  <button id="ovb"></button>
</div></div>

<script>
"use strict";
/* 타일 서바이브 — 싱글 웹판
   🚨 만들 때 정한 것
   ① 기다리게 하지 않는다. 오프라인 타이머도, 에너지도 없다. 한 판이 5분 안에 끝난다.
   ② 한 번 누르면 한 가지가 일어난다. 메뉴를 파고들지 않는다.
   ③ 한글·영어 두 벌. 글은 전부 W 에만 있고 게임 속엔 한 글자도 없다.  */

/* 「밭을·밭를」처럼 두 개를 다 적으면 읽기에 거칠다.
   한글은 받침이 있으면 을/이/은, 없으면 를/가/는 이다. 끝 글자로 가려낸다. */
function josa(word, withBatchim, without){
  const last = (word || "").charCodeAt((word || "x").length - 1);
  const hasBatchim = last >= 0xAC00 && last <= 0xD7A3 && (last - 0xAC00) % 28 !== 0;
  return word + (hasBatchim ? withBatchim : without);
}
const eul = w => josa(w, "을", "를");
const iga = w => josa(w, "이", "가");

const W = {
  ko:{
    title:"타일 서바이브", sub:"한 판 5분",
    food:"식량", wood:"목재", power:"전력", scrap:"고철", day:"날",
    hint:"안개 낀 칸을 눌러 여십시오. 식량 1이 들고, 그 땅에서 나오는 것을 한 번 받습니다.",
    pick:"칸을 하나 고르십시오.",
    opened:t=>`${t} 칸이 열렸습니다.`,
    openedGot:(t,g)=>`${t} 칸이 열렸습니다. ${g}`,
    need:(n,r)=>`${iga(r)} ${n}만큼 모자랍니다.`,
    built:b=>`${eul(b)} 지었습니다.`,
    upgraded:(b,l)=>`${eul(b)} ${l}단계로 올렸습니다.`,
    nopower:"전력이 모자라 몇몇 건물이 멈췄습니다.",
    starve:"식량이 바닥났습니다. 사람이 줄고 있습니다.",
    dayend:d=>`${d}일째 아침입니다.`,
    win:"구조 신호를 보냈습니다",
    lose:"버티지 못했습니다",
    winp:"송신탑이 하늘로 신호를 쏘아 올렸습니다. 누군가 듣고 있을 겁니다.",
    losep:"식량이 사흘째 바닥이었습니다. 밭은 전기가 와야 곡식을 냅니다. 다음 판엔 발전기를 먼저 세우고 밭을 지어 보십시오.",
    score:d=>`${d}일 버팀`,
    retry:"다시 하기", again:"다시",
    tiles:{empty:"빈 땅",forest:"숲",farm:"묵은 밭",ruin:"폐허",water:"물가",rubble:"무너진 더미"},
    b:{farm:"밭",saw:"벌목소",gen:"발전기",well:"우물",yard:"고물터",tower:"송신탑"},
    bd:{farm:"식량 +2",saw:"목재 +2",gen:"전력 +5",well:"식량 +1 · 전력 1",
        yard:"고철 +2",tower:"이기는 건물"},
    salvaged:(n,r)=>`더미를 치우고 ${iga(r)} ${n}개 나왔습니다.`,
    pulled:(b,n,r)=>`${eul(b)} 헐었습니다. ${iga(r)} ${n} 돌아왔습니다.`,
    open:"열기", build:"짓기", up:"올리기", clear:"치우기", pull:"헐기",
    cost:c=>"값 "+c, lv:l=>l+"단계",
    towerNeed:"송신탑: 목재 40 · 고철 25 · 전력 10 이 남아 있어야 합니다.",
    canthere:"여기에는 지을 수 없습니다.",
    tip:"열 수 있는 칸은 테두리가 밝습니다."
  },
  en:{
    title:"Tile Survive", sub:"One run, five minutes",
    food:"Food", wood:"Wood", power:"Power", scrap:"Scrap", day:"Day",
    hint:"Tap a tile in the fog to open it. It costs one food, and the land gives you something once.",
    pick:"Pick a tile.",
    opened:t=>`You opened ${t}.`,
    openedGot:(t,g)=>`You opened ${t}. ${g}`,
    need:(n,r)=>`Short of ${n} ${r}.`,
    built:b=>`${b} built.`,
    upgraded:(b,l)=>`${b} raised to level ${l}.`,
    nopower:"Not enough power — some buildings have stopped.",
    starve:"Food has run out. People are leaving.",
    dayend:d=>`Morning of day ${d}.`,
    win:"The signal is out",
    lose:"You did not last",
    winp:"The tower has thrown a signal at the sky. Somebody is listening.",
    losep:"Food was empty three days running. A field only grows when power reaches it — next time raise a generator first, then the field.",
    score:d=>`Lasted ${d} days`,
    retry:"Play again", again:"Restart",
    tiles:{empty:"bare ground",forest:"woodland",farm:"an old field",ruin:"ruins",water:"a waterside",rubble:"a collapsed heap"},
    b:{farm:"Field",saw:"Sawmill",gen:"Generator",well:"Well",yard:"Scrap yard",
       tower:"Signal tower"},
    bd:{farm:"Food +2",saw:"Wood +2",gen:"Power +5",well:"Food +1 · Power 1",
        yard:"Scrap +2",tower:"The winning build"},
    salvaged:(n,r)=>`You cleared the heap and pulled out ${n} ${r.toLowerCase()}.`,
    pulled:(b,n,r)=>`${b} pulled down. ${n} ${r.toLowerCase()} came back.`,
    open:"Open", build:"Build", up:"Upgrade", clear:"Clear", pull:"Demolish",
    cost:c=>"Cost "+c, lv:l=>"level "+l,
    towerNeed:"Signal tower: 40 wood, 25 scrap, and 10 spare power.",
    canthere:"You cannot build here.",
    tip:"Tiles you can open have a brighter edge."
  }
};

const SIZE = 9, DAY_MS = 9000;
const KINDS = ["empty","forest","farm","ruin","water","rubble"];
const ICON = {empty:"",forest:"🌲",farm:"🌾",ruin:"🏚",water:"💧",rubble:"⛰"};
const BUILD = {
  farm : {on:["farm","empty"],  cost:{wood:6},              food:2, power:-1, icon:"🌱"},
  saw  : {on:["forest"],        cost:{wood:4},              wood:2, power:-1, icon:"🪓"},
  gen  : {on:["ruin","empty"],  cost:{wood:10,scrap:6},     power:5,          icon:"⚡"},
  well : {on:["water"],         cost:{wood:8},              food:1, power:-1, icon:"🚰"},
  /* 🚨 눌러 보고 잡은 흠 그 둘 : 2일부터 29일까지 «누를 것이 하나도 없었다».
     고철이 하루 1개씩만 저절로 늘어서, 송신탑에 드는 고철 25를 채우려면
     손님이 4분 넘게 «구경만» 해야 했다. 손님이 손을 쓸 자리가 없으면 그것은 게임이 아니다.
     그래서 「무너진 더미」에 «고물터»를 두었다. 이제 더미는 걸리적거리는 것이 아니라
     찾아낼 값어치가 있는 칸이 되고, 손님이 고철 속도를 스스로 올릴 수 있다. */
  yard : {on:["rubble"],        cost:{wood:5},              scrap:2, power:-1, icon:"♻"},
  tower: {on:["empty","ruin"],  cost:{wood:40,scrap:25},    power:-10,        icon:"📡"}
};

let L = "ko", S = null, timer = null, sel = null;
const $ = id => document.getElementById(id);

function make(){
  const g = [];
  for (let y=0;y<SIZE;y++) for (let x=0;x<SIZE;x++){
    let k = "empty", r = Math.random();
    if (r<.20) k="forest"; else if (r<.32) k="farm"; else if (r<.44) k="ruin";
    else if (r<.52) k="water"; else if (r<.62) k="rubble";
    g.push({x,y,kind:k,open:false,b:null,lv:1});
  }
  const mid = Math.floor(SIZE/2)*SIZE + Math.floor(SIZE/2);
  g[mid].kind = "empty"; g[mid].open = true;
  for (const n of around(g, g[mid])) { n.open = true; if (n.kind==="rubble") n.kind="empty"; }
  return g;
}
const at = (g,x,y) => (x<0||y<0||x>=SIZE||y>=SIZE) ? null : g[y*SIZE+x];
const around = (g,t) => [at(g,t.x+1,t.y),at(g,t.x-1,t.y),at(g,t.x,t.y+1),at(g,t.x,t.y-1)].filter(Boolean);
const canOpen = t => !t.open && around(S.g,t).some(n=>n.open);

/* 🚨 눌러 보고 잡은 흠 : 목재 12 · 고철 4 로 시작하면 «어떻게 해도 못 이긴다».
   건물은 전기가 와야 돌고(gen >= use), 전기는 발전기(목재 10·고철 6)만 낸다.
   목재를 버는 벌목소는 목재 4. 그러니 처음에 목재 14·고철 6 이 없으면
   발전기와 벌목소를 함께 세울 수 없고, 목재 버는 길이 영영 열리지 않는다.
   시작 밑천을 목재 20 · 고철 6 으로 올려 첫날에 발전기+벌목소+밭이 서게 한다. */
function reset(){
  S = {g:make(), food:14, wood:20, power:0, scrap:6, day:1, hungry:0, over:null, msg:""};
  sel = null;
  $("over").classList.remove("on");
  say(() => W[L].hint);
  draw();
  clearInterval(timer);
  timer = setInterval(tick, DAY_MS);
}

/* 🚨 눌러 보고 잡은 흠 그 다섯 — 이 게임에서 가장 나빴던 것.
   전력이 «1만 모자라도» 건물이 «전부» 멈췄다. 그러면 목재도 식량도 0이 되고,
   발전기를 세울 목재 10을 벌 길이 영영 없어 그대로 굶어 죽는다. 손님 잘못이 아닌데 끝난다.
   게다가 화면 안내문은 원래부터 「몇몇 건물이 멈췄습니다」라고 적고 있었다 —
   말과 속이 달랐던 것이다.
   → 전기를 «지은 차례대로» 나눠 준다. 모자라면 뒤에 지은 것부터 멈춘다.
     앞에 지은 벌목소는 계속 돌아가니, 손님은 언제든 다시 일어설 수 있다. */
function rates(){
  let food=0, wood=0, scrap=0, gen=0, use=0, left=0;
  const off = new Set();
  for (const t of S.g) if (t.b && BUILD[t.b].power > 0) gen += BUILD[t.b].power * t.lv;
  left = gen;
  for (const t of S.g) if (t.b){
    const d = BUILD[t.b];
    if (d.power >= 0) continue;
    const need = -d.power;
    use += need;
    if (left >= need){ left -= need; } else { off.add(t); continue; }
    if (d.food)  food  += d.food  * t.lv;
    if (d.wood)  wood  += d.wood  * t.lv;
    if (d.scrap) scrap += d.scrap * t.lv;
  }
  return {food, wood, scrap, gen, use, spare:gen-use, powered:off.size===0, off};
}

function tick(){
  if (S.over) return;
  const r = rates();
  // 고물터를 하나도 안 지은 사람도 아주 천천히는 나아가도록 하루 1개는 그냥 준다.
  S.food += r.food; S.wood += r.wood; S.scrap += r.scrap + 1;
  S.power = r.spare;
  S.food -= 2;                                  // 사람들이 먹는 몫
  if (S.food < 0){ S.food = 0; S.hungry++; } else S.hungry = 0;
  S.day++;
  if (S.hungry >= 3) return finish(false);
  const d = S.day;
  say(() => !r.powered ? W[L].nopower : S.hungry ? W[L].starve : W[L].dayend(d));
  draw();
}

/* 끝 딱지의 글도 «그때그때 다시 만든다». 그래야 말을 바꾸면 같이 바뀐다. */
function endcard(){
  const win = S.over === "win";
  $("ovt").textContent = win ? W[L].win : W[L].lose;
  $("ovs").textContent = W[L].score(S.day);
  $("ovp").textContent = win ? W[L].winp : W[L].losep;
  $("ovb").textContent = W[L].retry;
}

function finish(win){
  S.over = win ? "win" : "lose";
  clearInterval(timer);
  endcard();
  $("over").classList.add("on");
  draw();
}

function pay(cost){
  for (const k in cost) if (S[k] < cost[k]){
    const short = cost[k]-S[k], res = k; say(() => W[L].need(short, W[L][res]));
    return false;
  }
  for (const k in cost) S[k] -= cost[k];
  return true;
}
const costText = c => Object.keys(c).map(k=>`${W[L][k]} ${c[k]}`).join(" · ");

/* 🚨 눌러 보고 잡은 흠 그 셋 : 칸 하나 여는 데 식량 3이 들었다.
   밭 하나로는 버는 것과 먹는 것이 똑같아(+2 −2) 식량이 «영영 안 쌓인다».
   그래서 손님은 칸을 더 열지 못하고, 열지 못하니 지을 자리도 못 찾고, 그대로 굶어 죽었다.
   게임에서 가장 재미있는 일(안개를 걷는 일)에 벌을 주고 있었던 셈이다.
   → 여는 값을 1로 낮추고, 칸을 열면 그 땅에서 «한 번 나오는 것»을 준다.
     이제 여는 일이 손해가 아니라 이득이고, 어디를 먼저 열까가 고르는 재미가 된다. */
const OPEN_COST = 1;
const FIND = {forest:{wood:3}, farm:{food:3}, ruin:{scrap:2},
              water:{food:2}, rubble:{scrap:1}, empty:{}};

function openTile(t){
  if (!canOpen(t)) return;
  if (!pay({food:OPEN_COST})) return;
  t.open = true; sel = t;
  const k = t.kind, got = FIND[k] || {};
  for (const r in got) S[r] += got[r];
  const gotText = Object.keys(got).map(r => `${W[L][r]} +${got[r]}`).join(" · ");
  say(() => gotText ? W[L].openedGot(W[L].tiles[k], gotText) : W[L].opened(W[L].tiles[k]));
  draw();
}

function build(key){
  const t = sel, d = BUILD[key];
  if (!t || !t.open) return say(() => W[L].pick);
  if (t.b) return say(() => W[L].canthere);
  if (!d.on.includes(t.kind)) return say(() => W[L].canthere);
  if (key === "tower" && rates().spare < 10) return say(() => W[L].towerNeed);
  if (!pay(d.cost)) return;
  t.b = key;
  say(() => W[L].built(W[L].b[key]));
  if (key === "tower") return finish(true);
  draw();
}

function upgrade(){
  const t = sel;
  if (!t || !t.b || t.b === "tower" || t.lv >= 3) return;
  const c = {wood: 6*t.lv, scrap: 3*t.lv};
  if (!pay(c)) return;
  t.lv++;
  const bk = t.b, lv = t.lv; say(() => W[L].upgraded(W[L].b[bk], lv));
  draw();
}

/* 더미를 치우면 «고철 4개»가 한 번에 나온다.
   그래서 더미 칸마다 고르는 재미가 생긴다 — 지금 4개를 받을 것인가,
   고물터를 지어 하루 2개씩 계속 받을 것인가. */
const SALVAGE = 4;

/* 🚨 눌러 보고 잡은 흠 그 넷 : 열린 칸마다 건물을 세우고 나면
   «송신탑 세울 자리가 없어» 아무리 모아도 못 이기는 막다른 길이 생겼다.
   무른 데가 없는 게임은 손님을 가둔다. 잘못 지은 건물을 헐 수 있게 한다.
   목재는 절반만 돌려준다 — 되돌릴 수는 있되 공짜는 아니게. */
function demolish(){
  const t = sel;
  if (!t || !t.b || t.b === "tower") return;
  const back = Math.floor((BUILD[t.b].cost.wood || 0) * t.lv / 2);
  const name = W[L].b[t.b];
  t.b = null; t.lv = 1;
  S.wood += back;
  say(() => W[L].pulled(name, back, W[L].wood));
  draw();
}

function clearRubble(){
  const t = sel;
  if (!t || t.kind !== "rubble") return;
  if (!pay({wood:3})) return;
  t.kind = "empty";
  S.scrap += SALVAGE;
  say(() => W[L].salvaged(SALVAGE, W[L].scrap));
  draw();
}

/* 🚨 사진을 찍어 보고 잡은 흠 : 말을 바꿔도 아래 안내문만 옛 나라말로 남았다.
   글자를 담아 두지 말고 «글자를 만드는 법»을 담아 두면 다시 그릴 때 저절로 바뀐다. */
function say(fn){ S.msg = fn; $("msg").textContent = typeof fn === "function" ? fn() : fn; }

function draw(){
  const b = $("board");
  const cell = Math.max(30, Math.min(52,
    Math.floor((Math.min(window.innerWidth-28, window.innerHeight-300)) / SIZE) - 3));
  b.style.gridTemplateColumns = `repeat(${SIZE}, ${cell}px)`;
  b.innerHTML = "";
  const rOff = rates().off;
  for (const t of S.g){
    const d = document.createElement("div");
    d.className = "t" + (t.open ? " open" : "")
      + (!t.open && canOpen(t) ? " can" : "")
      + (t.open && t.kind === "rubble" ? " blocked" : "")
      + (rOff.has(t) ? " off" : "")
      + (sel === t ? " sel" : "");
    d.style.width = d.style.height = cell + "px";
    d.textContent = t.open ? (t.b ? BUILD[t.b].icon : ICON[t.kind]) : "";
    if (t.b && t.lv > 1){
      const s = document.createElement("span");
      s.className = "lv"; s.textContent = t.lv; d.appendChild(s);
    }
    d.onclick = () => {
      if (S.over) return;
      if (!t.open) openTile(t); else { sel = t; draw(); }
    };
    b.appendChild(d);
  }
  const rr = rates();
  $("food").textContent  = S.food;
  $("wood").textContent  = S.wood;
  $("power").textContent = rr.spare;
  $("scrap").textContent = S.scrap;
  $("day").textContent   = S.day;
  $("rfood").textContent  = (rr.food-2>=0?"+":"") + (rr.food-2);
  $("rwood").textContent  = "+" + rr.wood;
  $("rpower").textContent = rr.gen + "/" + rr.use;
  $("rscrap").textContent = "+" + (rr.scrap + 1);
  acts();
}

function acts(){
  const box = $("acts");
  box.innerHTML = "";
  const t = sel;
  const add = (label, sub, fn, ok) => {
    const el = document.createElement("button");
    el.className = "b";
    el.innerHTML = `<span>${label}</span><small>${sub}</small>`;
    el.disabled = !ok; el.onclick = fn;
    box.appendChild(el);
  };
  if (!t || !t.open){
    const el = document.createElement("div");
    el.style.cssText = "font-size:12px;color:var(--dim)";
    el.textContent = W[L].tip;
    box.appendChild(el);
    return;
  }
  /* 🚨 「목재 +2 · 목재 4」처럼 버는 것과 드는 것이 똑같이 보였다.
     드는 쪽에는 W 에 이미 있던 「값」을 붙여 준다. */
  if (t.kind === "rubble" && !t.b)
    add(W[L].clear, W[L].scrap + " +" + SALVAGE + " · " + W[L].cost(costText({wood:3})),
        clearRubble, S.wood >= 3);
  for (const key in BUILD){
    const d = BUILD[key];
    if (t.b || !d.on.includes(t.kind)) continue;
    add(W[L].build + " · " + W[L].b[key],
        W[L].bd[key] + " · " + W[L].cost(costText(d.cost)), () => build(key), true);
  }
  if (t.b && t.b !== "tower" && t.lv < 3)
    add(W[L].up + " · " + W[L].b[t.b],
        W[L].lv(t.lv+1) + " · " + W[L].cost(costText({wood:6*t.lv, scrap:3*t.lv})), upgrade, true);
  if (t.b && t.b !== "tower")
    add(W[L].pull + " · " + W[L].b[t.b],
        W[L].wood + " +" + Math.floor((BUILD[t.b].cost.wood||0)*t.lv/2), demolish, true);
}

function relabel(){
  document.documentElement.lang = L;
  $("ttl").textContent = W[L].title;
  $("sub").textContent = W[L].sub;
  $("lang").textContent = L === "ko" ? "EN" : "한국어";
  $("again").textContent = W[L].again;
  ["food","wood","power","scrap","day"].forEach((k,i) => {
    $("l"+(i+1)).textContent = W[L][k];
  });
  if (S) { say(S.msg || (() => W[L].hint)); draw(); if (S.over) endcard(); }
}

$("lang").onclick = () => { L = L === "ko" ? "en" : "ko";
  try { localStorage.setItem("tile.lang", L); } catch(e){} relabel(); };
$("again").onclick = reset;
$("ovb").onclick = reset;
window.addEventListener("resize", () => S && draw());

try { const s = localStorage.getItem("tile.lang"); if (s === "ko" || s === "en") L = s; } catch(e){}
if (L === "ko" && !/^ko/i.test(navigator.language || "")) L = "en";
reset(); relabel();
</script>
</body></html>
